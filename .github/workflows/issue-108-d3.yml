name: Issue 108 D3 incremental visual commit

on:
  push:
    branches:
      - perf/issue-108-d3-incremental-visual-commit
  pull_request:
    paths:
      - 'game/scripts/objects/procedural_object_stream.gd'
      - 'game/tests/issue108_d3_incremental_visual_commit_tests.gd'
      - '.github/workflows/issue-108-d3.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Import
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path game --import 2>&1 | tee /tmp/import.log
          ! grep -q 'SCRIPT ERROR:' /tmp/import.log

      - name: D3 incremental visual commit
        shell: bash
        run: |
          set -o pipefail
          SANDBOX_PERF_TRACE=1 SANDBOX_PERF_TRACE_MIN_MS=0 timeout --signal=TERM 240s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/issue108_d3_incremental_visual_commit_tests.gd 2>&1 | tee /tmp/d3.log
          grep -q 'ISSUE108_D3_VISUAL_COMMIT_PASS' /tmp/d3.log
          ! grep -q 'SCRIPT ERROR:' /tmp/d3.log
          ! grep -q 'ERROR: FAIL:' /tmp/d3.log

      - name: D2 materialization regression
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM 180s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/issue108_d2_object_materialization_tests.gd 2>&1 | tee /tmp/d2.log
          grep -q 'ISSUE108_D2_MATERIALIZATION_PASS' /tmp/d2.log
          ! grep -q 'SCRIPT ERROR:' /tmp/d2.log
          ! grep -q 'ERROR: FAIL:' /tmp/d2.log

      - name: D1 real-scene streaming regression
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM 300s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/issue108_d1_scene_streaming_performance_tests.gd 2>&1 | tee /tmp/d1-scene.log
          grep -q 'ISSUE108_D1_SCENE_PASS' /tmp/d1-scene.log
          ! grep -q 'SCRIPT ERROR:' /tmp/d1-scene.log
          ! grep -q 'ERROR: FAIL:' /tmp/d1-scene.log

      - name: Placement regression
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM 180s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/p3_0d_entity_placement_tests.gd 2>&1 | tee /tmp/placement.log
          grep -q 'P3_0D_PLACEMENT_PASS' /tmp/placement.log
          ! grep -q 'SCRIPT ERROR:' /tmp/placement.log
          ! grep -q 'ERROR: FAIL:' /tmp/placement.log

      - name: Canonical validation
        shell: bash
        run: |
          set -o pipefail
          GODOT_BIN=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64 bash scripts/validate.sh 2>&1 | tee /tmp/validate.log
          grep -q 'VALIDATION_PASS' /tmp/validate.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue108-d3-evidence
          path: |
            /tmp/import.log
            /tmp/d3.log
            /tmp/d2.log
            /tmp/d1-scene.log
            /tmp/placement.log
            /tmp/validate.log
