name: P5.0A environment core qualification

on:
  pull_request:
    branches:
      - main
    paths:
      - 'game/scripts/simulation/environment_state_store.gd'
      - 'game/scripts/simulation/fixed_tick_scheduler.gd'
      - 'game/scripts/simulation/simulation_runtime.gd'
      - 'game/scripts/simulation/simulation_world_scope_lifecycle.gd'
      - 'game/tests/p4_0c_simulation_tier_router_tests.gd'
      - 'game/tests/p5_0a_environment_core_tests.gd'
      - 'scripts/ci/run-p5-0a-qualification.ps1'
      - 'scripts/validate.sh'
      - 'docs/specs/P5-0A-ENVIRONMENT-CORE.md'
      - '.github/workflows/p5-0a-environment-core.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 135
    env:
      GODOT_BIN: 'C:\Tools\Godot\Godot_v4.7.2-stable_win64_console.exe'
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
      - name: Verify runner and pinned Godot
        shell: cmd
        run: |
          @echo off
          if /I not "%RUNNER_OS%"=="Windows" exit /b 1
          if /I not "%RUNNER_ARCH%"=="X64" exit /b 1
          if not exist "%GODOT_BIN%" exit /b 1
          "%GODOT_BIN%" --version
          if errorlevel 1 exit /b 1
      - name: Run P5.0A environment-core qualification
        shell: cmd
        timeout-minutes: 130
        run: |
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\scripts\ci\run-p5-0a-qualification.ps1" -GodotBin "%GODOT_BIN%"
          if errorlevel 1 exit /b 1
      - name: Upload P5/P4 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p5-0a-environment-core-evidence
          path: |
            ${{ runner.temp }}\p5-0a-evidence\*.log
            ${{ runner.temp }}\p4-0h-evidence\*.log
            ${{ runner.temp }}\p4-0g-evidence\*.log
            ${{ runner.temp }}\p4-0f-evidence\*.log
            ${{ runner.temp }}\p4-0e-evidence\*.log
            ${{ runner.temp }}\p4-0d-evidence\*.log
            ${{ runner.temp }}\p4-0c-evidence\*.log
            ${{ runner.temp }}\p4-0b-evidence\*.log
            ${{ runner.temp }}\p4-0a-evidence\*.log
          if-no-files-found: warn
          retention-days: 14
