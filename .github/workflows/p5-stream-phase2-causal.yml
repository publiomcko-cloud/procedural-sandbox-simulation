name: P5 Phase 2 causal streaming diagnostic (DO NOT MERGE)

on:
  push:
    branches:
      - exp/p5-stream-phase2-causal

concurrency:
  group: p5-phase2-causal-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  causal:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 55
    env:
      GODOT_BIN: 'C:\Tools\Godot\Godot_v4.7.2-stable_win64_console.exe'
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
      - name: Validate exact commit, PowerShell scripts, Godot scene and imported classes
        shell: powershell
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          git rev-parse HEAD
          if (-not (Test-Path -LiteralPath $env:GODOT_BIN -PathType Leaf)) { throw 'Missing pinned Godot binary' }
          foreach ($relative in @('scripts/perf/run-p5-deterministic-stream-benchmark.ps1', 'scripts/perf/analyze-p5-phase2-causal.ps1', 'scripts/perf/run-p5-phase2-causal.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path (Get-Location).Path $relative), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "PowerShell parse failed: $relative - $($errors[0])" }
          }
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'p5-phase2-parse-appdata'
          New-Item -ItemType Directory -Force -Path $env:APPDATA | Out-Null
          & $env:GODOT_BIN --headless --editor --path .\game --import
          if ($LASTEXITCODE -ne 0) { throw 'Godot import failed' }
          & $env:GODOT_BIN --headless --path .\game --check-only --script res://scripts/terrain/terrain_demo.gd
          if ($LASTEXITCODE -ne 0) { throw 'Godot terrain scene parse failed' }
          & $env:GODOT_BIN --headless --path .\game --script res://tests/p5_stream_coarse_preview_tests.gd
          if ($LASTEXITCODE -ne 0) { throw 'E2 preview contracts failed' }
      - name: Collect full 16-trial deterministic cold-state ABBA matrix
        shell: cmd
        timeout-minutes: 42
        run: |
          @echo off
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\scripts\perf\run-p5-phase2-causal.ps1" -GodotBin "%GODOT_BIN%"
          if errorlevel 1 exit /b 1
      - name: Upload phase 2 traces, metrics, causal report and audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p5-phase2-causal-evidence-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}\p5-phase2-causal\*.log
            ${{ runner.temp }}\p5-phase2-causal\*.json
            ${{ runner.temp }}\p5-phase2-causal\*.md
          if-no-files-found: warn
          retention-days: 14
