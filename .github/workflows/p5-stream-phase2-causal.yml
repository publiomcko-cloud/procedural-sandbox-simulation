name: P5 Phase 2 causal streaming diagnostic (DO NOT MERGE)

on:
  workflow_dispatch:

concurrency:
  group: p5-phase2-causal-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  causal:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 55
    env:
      GODOT_BIN: 'C:\Tools\Godot\Godot_v4.7.2-stable_win64_console.exe'
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
      - name: Validate scripts and exact Godot import using PowerShell bypass entrypoint
        shell: cmd
        timeout-minutes: 8
        run: |
          @echo off
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\scripts\ci\run-p5-phase2-static-qualification.ps1" -GodotBin "%GODOT_BIN%"
          if errorlevel 1 exit /b 1
      - name: Collect full 16-trial deterministic cold-state ABBA matrix
        shell: cmd
        timeout-minutes: 42
        run: |
          @echo off
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\scripts\perf\run-p5-phase2-causal.ps1" -GodotBin "%GODOT_BIN%"
          if errorlevel 1 exit /b 1
      - name: Upload phase 2 traces, metrics, causal report and audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p5-phase2-causal-evidence-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}\p5-phase2-causal\*.log
            ${{ runner.temp }}\p5-phase2-causal\*.json
            ${{ runner.temp }}\p5-phase2-causal\*.md
          if-no-files-found: warn
          retention-days: 14
