name: Performance regression qualification

on:
  push:
    branches:
      - perf/p3-1-streaming-edit-latency

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCALABLE_EDIT_COUNT: "4096"
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip             https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64

      - name: Import project
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path game --quit             2>&1 | tee /tmp/perf-import.log

      - name: Frozen shared-surface E2E
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game             --script res://tests/experiments/shared_surface_e2e_integration.gd             2>&1 | tee /tmp/perf-shared-e2e.log
          grep -q 'SHARED_SURFACE_E2E_PASS' /tmp/perf-shared-e2e.log

      - name: Materialized SDF fidelity
        run: |
          set -o pipefail
          timeout --signal=TERM 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game             --script res://tests/experiments/materialized_sdf_scalability_qualification.gd             2>&1 | tee /tmp/perf-materialized.log
          grep -q 'MATERIALIZED_SDF_SCALE_PASS' /tmp/perf-materialized.log

      - name: Global X Z corner geometry
        run: |
          set -o pipefail
          timeout --signal=TERM 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game             --script res://tests/experiments/global_shared_surface_qualification.gd             2>&1 | tee /tmp/perf-global-shared.log
          grep -q 'GLOBAL_SHARED_SURFACE_PASS' /tmp/perf-global-shared.log

      - name: Playable runtime diagonal unload reload
        run: |
          set -o pipefail
          timeout --signal=TERM 180s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game             --script res://tests/experiments/runtime_scalable_playable_qualification.gd             2>&1 | tee /tmp/perf-runtime.log
          grep -q 'RUNTIME_SCALABLE_PLAYABLE_PASS' /tmp/perf-runtime.log

      - name: Performance benchmark
        run: |
          set -o pipefail
          timeout --signal=TERM 180s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game             --script res://tests/experiments/runtime_performance_baseline.gd             2>&1 | tee /tmp/perf-benchmark.log
          grep -q 'RUNTIME_PERFORMANCE_BASELINE_PASS' /tmp/perf-benchmark.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-regression-evidence
          path: |
            /tmp/perf-import.log
            /tmp/perf-shared-e2e.log
            /tmp/perf-materialized.log
            /tmp/perf-global-shared.log
            /tmp/perf-runtime.log
            /tmp/perf-benchmark.log
