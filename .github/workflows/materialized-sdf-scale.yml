name: Materialized SDF scalability qualification

on:
  push:
    branches:
      - exp/p3-1-shared-surface-e2e-success
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Materialized SDF load + fidelity / Godot 4.7.2
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SCALABLE_EDIT_COUNT: "4096"
    steps:
      - uses: actions/checkout@v4

      - name: Download stock Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3             -o /tmp/godot.zip             https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Import project script classes
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64             --headless --editor --path game --quit             2>&1 | tee /tmp/import.log

      - name: Re-run frozen shared-surface E2E
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64             --headless --path game             --script res://tests/experiments/shared_surface_e2e_integration.gd             2>&1 | tee /tmp/shared-surface-e2e.log
          grep -q 'SHARED_SURFACE_E2E_PASS' /tmp/shared-surface-e2e.log

      - name: Run materialized SDF scalability qualification
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM 90s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64             --headless --path game             --script res://tests/experiments/materialized_sdf_scalability_qualification.gd             2>&1 | tee /tmp/materialized-sdf-scale.log
          grep -q 'MATERIALIZED_SDF_SCALE_PASS' /tmp/materialized-sdf-scale.log

      - name: Run global X Z corner qualification
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64             --headless --path game             --script res://tests/experiments/global_shared_surface_qualification.gd             2>&1 | tee /tmp/global-shared-surface.log
          grep -q 'GLOBAL_SHARED_SURFACE_PASS' /tmp/global-shared-surface.log

      - name: Run playable runtime unload/reload qualification
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM 180s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64             --headless --path game             --script res://tests/experiments/runtime_scalable_playable_qualification.gd             2>&1 | tee /tmp/runtime-scalable-playable.log
          grep -q 'RUNTIME_SCALABLE_PLAYABLE_PASS' /tmp/runtime-scalable-playable.log

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: materialized-sdf-scale-evidence
          path: |
            /tmp/import.log
            /tmp/shared-surface-e2e.log
            /tmp/materialized-sdf-scale.log
            /tmp/global-shared-surface.log
            /tmp/runtime-scalable-playable.log
