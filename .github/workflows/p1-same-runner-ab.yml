name: P1 same-runner A/B benchmark

on:
  push:
    branches:
      - perf/p1-incremental-shared-subvolumes

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout P0 control
        uses: actions/checkout@v4
        with:
          ref: 4dd27dc43a2c16acb5eef416dc12cd98ca2ae070
          path: p0

      - name: Checkout P1 candidate
        uses: actions/checkout@v4
        with:
          ref: 19fa78850981d122ce5e95bc5354617ca84e3e59
          path: p1

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Import both exact refs
        shell: bash
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path p0/game --quit > /tmp/p0-import.log 2>&1
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path p1/game --quit > /tmp/p1-import.log 2>&1

      - name: Alternate P0 and P1 repeated benchmarks
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            echo "=== AB_ROUND=$i P0 ==="
            /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path p0/game --script res://tests/experiments/p1_shared_repeat_benchmark.gd 2>&1 | tee "/tmp/ab-p0-$i.log"
            grep -q 'P1_SHARED_REPEAT_BENCHMARK_PASS' "/tmp/ab-p0-$i.log"
            echo "=== AB_ROUND=$i P1 ==="
            /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path p1/game --script res://tests/experiments/p1_shared_repeat_benchmark.gd 2>&1 | tee "/tmp/ab-p1-$i.log"
            grep -q 'P1_SHARED_REPEAT_BENCHMARK_PASS' "/tmp/ab-p1-$i.log"
          done

      - name: Upload A/B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-same-runner-ab
          path: |
            /tmp/p0-import.log
            /tmp/p1-import.log
            /tmp/ab-p0-*.log
            /tmp/ab-p1-*.log
