name: P4.0E material runtime orchestration

on:
  pull_request:
    branches:
      - feat/p4-0d-material-environment-state
      - main
    paths:
      - 'game/scripts/simulation/material_environment_runtime_bridge.gd'
      - 'game/scripts/simulation/material_environment_work_queue.gd'
      - 'game/scripts/simulation/simulation_runtime.gd'
      - 'game/tests/p4_0e_material_runtime_tests.gd'
      - 'scripts/ci/run-p4-0e-qualification.ps1'
      - 'docs/specs/P4-0E-MATERIAL-RUNTIME-ORCHESTRATION.md'
      - '.github/workflows/p4-0e-material-runtime-orchestration.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    env:
      GODOT_BIN: 'C:\Tools\Godot\Godot_v4.7.2-stable_win64_console.exe'
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
      - name: Pinned Godot and runner
        shell: cmd
        run: |
          @echo off
          if /I not "%RUNNER_OS%"=="Windows" exit /b 1
          if /I not "%RUNNER_ARCH%"=="X64" exit /b 1
          if not exist "%GODOT_BIN%" exit /b 1
          "%GODOT_BIN%" --version
          if errorlevel 1 exit /b 1
      - name: P4.0E runtime and inherited P4.0D qualification
        shell: cmd
        timeout-minutes: 85
        run: |
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\scripts\ci\run-p4-0e-qualification.ps1" -GodotBin "%GODOT_BIN%"
          if errorlevel 1 exit /b 1
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p4-0e-self-hosted-windows-evidence
          path: |
            ${{ runner.temp }}\p4-0e-evidence\*.log
            ${{ runner.temp }}\p4-0d-evidence\*.log
            ${{ runner.temp }}\p4-0c-evidence\*.log
            ${{ runner.temp }}\p4-0b-evidence\*.log
            ${{ runner.temp }}\p4-0a-evidence\*.log
          if-no-files-found: warn
          retention-days: 7
