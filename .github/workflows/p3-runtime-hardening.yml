name: P3 runtime hardening qualification

on:
  push:
    branches:
      - perf/p3-runtime-hardening

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SCALABLE_EDIT_COUNT: "4096"
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Import
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path game --import 2>&1 | tee /tmp/import.log

      - name: Terrain SDF and cache immutability
        run: |
          set -o pipefail
          timeout --signal=TERM 180s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/terrain_sdf_tests.gd 2>&1 | tee /tmp/terrain-sdf.log
          grep -q 'TERRAIN_SDF_PASS' /tmp/terrain-sdf.log

      - name: Materialized SDF fidelity
        run: |
          set -o pipefail
          timeout --signal=TERM 180s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/experiments/materialized_sdf_scalability_qualification.gd 2>&1 | tee /tmp/materialized.log
          grep -q 'MATERIALIZED_SDF_SCALE_PASS' /tmp/materialized.log

      - name: Shared-surface global geometry
        run: |
          set -o pipefail
          timeout --signal=TERM 180s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/experiments/global_shared_surface_qualification.gd 2>&1 | tee /tmp/shared.log
          grep -q 'GLOBAL_SHARED_SURFACE_PASS' /tmp/shared.log

      - name: Terrain concurrency
        run: |
          set -o pipefail
          timeout --signal=TERM 240s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/terrain_concurrency_tests.gd 2>&1 | tee /tmp/concurrency.log
          grep -q 'TERRAIN_CONCURRENCY_PASS' /tmp/concurrency.log

      - name: LOD runtime
        run: |
          set -o pipefail
          timeout --signal=TERM 240s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/terrain_lod_runtime_tests.gd 2>&1 | tee /tmp/lod.log
          grep -q 'TERRAIN_LOD_RUNTIME_PASS' /tmp/lod.log

      - name: Procedural objects
        run: |
          set -o pipefail
          timeout --signal=TERM 360s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/procedural_object_tests.gd 2>&1 | tee /tmp/objects.log
          grep -q 'PROCEDURAL_OBJECT_PASS' /tmp/objects.log

      - name: Playable entity commands
        run: |
          set -o pipefail
          timeout --signal=TERM 300s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/playable_entity_command_tests.gd 2>&1 | tee /tmp/entities.log
          grep -q 'PLAYABLE_ENTITY_COMMAND_PASS' /tmp/entities.log

      - name: Entity history
        run: |
          set -o pipefail
          timeout --signal=TERM 240s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/entity_history_tests.gd 2>&1 | tee /tmp/history.log
          grep -q 'ENTITY_HISTORY_PASS' /tmp/history.log

      - name: Scalable playable runtime
        run: |
          set -o pipefail
          timeout --signal=TERM 300s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/experiments/runtime_scalable_playable_qualification.gd 2>&1 | tee /tmp/runtime.log
          grep -q 'RUNTIME_SCALABLE_PLAYABLE_PASS' /tmp/runtime.log

      - name: Runtime benchmark
        run: |
          set -o pipefail
          timeout --signal=TERM 300s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/experiments/runtime_performance_baseline.gd 2>&1 | tee /tmp/benchmark.log
          grep -q 'RUNTIME_PERFORMANCE_BASELINE_PASS' /tmp/benchmark.log

      - name: Core validation
        env:
          GODOT_BIN: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
        run: |
          set -o pipefail
          bash scripts/validate.sh 2>&1 | tee /tmp/validate.log
          grep -q 'VALIDATION_PASS' /tmp/validate.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-runtime-hardening-evidence
          path: /tmp/*.log
