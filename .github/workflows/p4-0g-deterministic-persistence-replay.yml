name: P4.0G deterministic persistence and replay

on:
  pull_request:
    branches:
      - feat/p4-0f-world-scope-streaming-lifecycle
      - main
    paths:
      - 'game/scripts/simulation/material_environment_domain.gd'
      - 'game/scripts/simulation/simulation_world_scope_lifecycle.gd'
      - 'game/scripts/simulation/simulation_runtime_store.gd'
      - 'game/scripts/simulation/simulation_runtime.gd'
      - 'game/scripts/terrain/terrain_demo.gd'
      - 'game/tests/p4_0g_deterministic_replay_persistence_tests.gd'
      - 'scripts/ci/run-p4-0g-qualification.ps1'
      - 'scripts/validate.sh'
      - 'docs/specs/P4-0G-DETERMINISTIC-PERSISTENCE-REPLAY.md'
      - '.github/workflows/p4-0g-deterministic-persistence-replay.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 105
    env:
      GODOT_BIN: 'C:\Tools\Godot\Godot_v4.7.2-stable_win64_console.exe'
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
      - name: Verify runner and pinned Godot
        shell: cmd
        run: |
          @echo off
          if /I not "%RUNNER_OS%"=="Windows" exit /b 1
          if /I not "%RUNNER_ARCH%"=="X64" exit /b 1
          if not exist "%GODOT_BIN%" exit /b 1
          "%GODOT_BIN%" --version
          if errorlevel 1 exit /b 1
      - name: Run P4.0G replay/persistence and inherited P4 qualification
        shell: cmd
        timeout-minutes: 100
        run: |
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\scripts\ci\run-p4-0g-qualification.ps1" -GodotBin "%GODOT_BIN%"
          if errorlevel 1 exit /b 1
      - name: Upload P4.0G evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p4-0g-self-hosted-windows-evidence
          path: |
            ${{ runner.temp }}\p4-0g-evidence\*.log
            ${{ runner.temp }}\p4-0f-evidence\*.log
            ${{ runner.temp }}\p4-0e-evidence\*.log
            ${{ runner.temp }}\p4-0d-evidence\*.log
            ${{ runner.temp }}\p4-0c-evidence\*.log
            ${{ runner.temp }}\p4-0b-evidence\*.log
            ${{ runner.temp }}\p4-0a-evidence\*.log
          if-no-files-found: warn
          retention-days: 7
