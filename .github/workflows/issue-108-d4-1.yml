name: Issue 108 D4.1 dormant projection scope cache

on:
  push:
    branches:
      - perf/issue-108-d4-1-dormant-projection-scope-cache
  pull_request:
    paths:
      - 'game/scripts/terrain/terrain_object_effect_projection_service.gd'
      - 'game/scripts/terrain/terrain_object_effect_runtime.gd'
      - 'game/tests/issue108_d4_1_dormant_projection_scope_cache_tests.gd'
      - '.github/workflows/issue-108-d4-1.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Import
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path game --import 2>&1 | tee /tmp/import.log
          ! grep -q 'SCRIPT ERROR:' /tmp/import.log

      - name: D4.1 dormant projection scope cache
        shell: bash
        run: |
          set -o pipefail
          SANDBOX_PERF_TRACE=1 SANDBOX_PERF_TRACE_MIN_MS=0 timeout --signal=TERM 240s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/issue108_d4_1_dormant_projection_scope_cache_tests.gd 2>&1 | tee /tmp/d4-1.log
          grep -q 'ISSUE108_D4_1_DORMANT_SCOPE_PASS' /tmp/d4-1.log
          ! grep -q 'SCRIPT ERROR:' /tmp/d4-1.log
          ! grep -q 'ERROR: FAIL:' /tmp/d4-1.log

      - name: D4 effect frame cache regression
        shell: bash
        run: |
          set -o pipefail
          SANDBOX_PERF_TRACE=1 SANDBOX_PERF_TRACE_MIN_MS=0 timeout --signal=TERM 240s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/issue108_d4_effect_frame_cache_tests.gd 2>&1 | tee /tmp/d4.log
          grep -q 'ISSUE108_D4_EFFECT_CACHE_PASS' /tmp/d4.log
          ! grep -q 'SCRIPT ERROR:' /tmp/d4.log
          ! grep -q 'ERROR: FAIL:' /tmp/d4.log

      - name: Phase D live integration regression
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM 240s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/issue108_phase_d_live_integration_tests.gd 2>&1 | tee /tmp/phase-d.log
          grep -q 'ISSUE108_PHASE_D_PASS' /tmp/phase-d.log
          ! grep -q 'SCRIPT ERROR:' /tmp/phase-d.log
          ! grep -q 'ERROR: FAIL:' /tmp/phase-d.log

      - name: D3 regression
        shell: bash
        run: |
          set -o pipefail
          SANDBOX_PERF_TRACE=1 SANDBOX_PERF_TRACE_MIN_MS=0 timeout --signal=TERM 240s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/issue108_d3_incremental_visual_commit_tests.gd 2>&1 | tee /tmp/d3.log
          grep -q 'ISSUE108_D3_VISUAL_COMMIT_PASS' /tmp/d3.log
          ! grep -q 'SCRIPT ERROR:' /tmp/d3.log
          ! grep -q 'ERROR: FAIL:' /tmp/d3.log

      - name: Canonical validation
        shell: bash
        run: |
          set -o pipefail
          GODOT_BIN=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64 bash scripts/validate.sh 2>&1 | tee /tmp/validate.log
          grep -q 'VALIDATION_PASS' /tmp/validate.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue108-d4-1-evidence
          path: |
            /tmp/import.log
            /tmp/d4-1.log
            /tmp/d4.log
            /tmp/phase-d.log
            /tmp/d3.log
            /tmp/validate.log
