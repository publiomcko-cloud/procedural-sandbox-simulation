name: Self-hosted runner verification

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/self-hosted-runner-verification.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Verify runner allocation
        shell: pwsh
        run: |
          Write-Output "SELF_HOSTED_RUNNER_ALLOCATED"
          Write-Output "RUNNER_OS=$env:RUNNER_OS"
          Write-Output "RUNNER_ARCH=$env:RUNNER_ARCH"

      - name: Verify Godot 4.7.2
        shell: pwsh
        run: |
          $godot = 'C:\Tools\Godot\Godot_v4.7.2-stable_win64_console.exe'
          if (-not (Test-Path -LiteralPath $godot -PathType Leaf)) {
            Write-Error "Godot executable not found at expected path"
            exit 1
          }
          $version = (& $godot --version 2>&1 | Out-String).Trim()
          Write-Output "GODOT_VERSION=$version"
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^4\.7\.2\.stable(\.|$)') {
            Write-Error "Godot 4.7.2 stable verification failed"
            exit 1
          }
          Write-Output "SELF_HOSTED_GODOT_READY"
