name: P5 E5 exact projection-pair optimization (DO NOT MERGE)

on:
  workflow_dispatch:

concurrency:
  group: p5-projection-e5-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualify:
    runs-on: [self-hosted, Windows, X64, gpu-interactive]
    timeout-minutes: 20
    env:
      GODOT_BIN: 'C:\Tools\Godot\Godot_v4.7.2-stable_win64_console.exe'
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
      - name: Import project and require exact descriptor/effect source digest parity
        shell: cmd
        timeout-minutes: 15
        run: |
          @echo off
          echo Runner=%RUNNER_NAME%
          if /I not "%RUNNER_NAME%"=="sandbox-gpu-interactive" exit /b 1
          git rev-parse HEAD
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\scripts\ci\run-p5-projection-e5-qualification.ps1" -GodotBin "%GODOT_BIN%"
          if errorlevel 1 exit /b 1
      - name: Preserve Godot parser, parity, and inherited effect tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p5-e5-qualification-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}\p5-projection-e5-qualification\*.log
          if-no-files-found: warn
          retention-days: 14

  benchmark:
    needs: qualify
    runs-on: [self-hosted, Windows, X64, gpu-interactive]
    timeout-minutes: 46
    env:
      GODOT_BIN: 'C:\Tools\Godot\Godot_v4.7.2-stable_win64_console.exe'
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
      - name: Verify interactive runner and import workspace-specific Godot scripts
        shell: cmd
        timeout-minutes: 8
        run: |
          @echo off
          echo E5_RUNNER=%RUNNER_NAME%
          if /I not "%RUNNER_NAME%"=="sandbox-gpu-interactive" exit /b 1
          "%GODOT_BIN%" --headless --editor --path .\game --import
          if errorlevel 1 exit /b 1
          "%GODOT_BIN%" --headless --path .\game --check-only --script res://scripts/terrain/terrain_demo.gd
          if errorlevel 1 exit /b 1
      - name: Collect 16 exact source/seed/route matched projection-geometry ABBA trials
        shell: cmd
        timeout-minutes: 40
        run: |
          @echo off
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\scripts\perf\run-p5-projection-e5-abba.ps1" -GodotBin "%GODOT_BIN%" -Frames 720
          if errorlevel 1 exit /b 1
      - name: Preserve each trial's stdout, stderr, metrics, and independent worker-latency verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p5-e5-projection-abba-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}\p5-projection-e5-abba\*.log
            ${{ runner.temp }}\p5-projection-e5-abba\*.json
          if-no-files-found: warn
          retention-days: 14
