name: DM17 interactive GPU wallclock ABBA
on:
  push:
    branches:
      - exp/dm17-gpu-validation
  workflow_dispatch:
concurrency:
  group: dm17-gpu-abba-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  gpu:
    runs-on: [self-hosted, Windows, X64, gpu-interactive]
    timeout-minutes: 45
    env:
      GODOT_BIN: 'C:\Tools\Godot\Godot_v4.7.2-stable_win64_console.exe'
      SANDBOX_TERRAIN_BACKEND: b4
      SANDBOX_DM9_FAST_B4: '1'
      SANDBOX_DM9_PREFETCH: '0'
      SANDBOX_DM9_VISUAL_ADAPTIVE: '1'
      SANDBOX_DM9_VISUAL_WORKERS: '4'
      SANDBOX_DM11_CANONICAL_FAST_B4: '1'
      SANDBOX_DM11_VISUAL_LANE: '0'
      SANDBOX_DM12_SURFACE_SLICE: '1'
      SANDBOX_DM12_FRAME_TRACE: '0'
      SANDBOX_DM13_WATER_WORKERS: '1'
      SANDBOX_DM13_WATER_NATIVE: '1'
      SANDBOX_DM14_DENSE_REQUIRED: '1'
      SANDBOX_DM14_LAZY_ROUTES: '0'
      SANDBOX_DM15_DORMANT_ROLLUP: '1'
      SANDBOX_DM15_RELEASE_TRACE: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
      - name: Confirm interactive Windows GPU session
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          & .\scripts\ci\p5-gpu-session-preflight.ps1 -Role Interactive
      - name: Parse and import Godot project
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          & $env:GODOT_BIN --headless --editor --path .\game --import
          if ($LASTEXITCODE -ne 0) { throw 'DM17_GPU_IMPORT_FAILED' }
      - name: GPU ABBA with tracing disabled and actual screenshots
        timeout-minutes: 36
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          & .\scripts\perf\run-dm17-gpu-abba.ps1 -GodotBin $env:GODOT_BIN -EvidenceDir (Join-Path $env:RUNNER_TEMP 'dm17-gpu-abba') -Frames 720
          if ($LASTEXITCODE -ne 0) { throw 'DM17_GPU_ABBA_FAILED' }
      - name: Archive GPU images and receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dm17-gpu-abba-evidence
          path: |
            ${{ runner.temp }}\dm17-gpu-abba\**\*.png
            ${{ runner.temp }}\dm17-gpu-abba\**\*.log
            ${{ runner.temp }}\dm17-gpu-abba\**\*.json
          retention-days: 14
          if-no-files-found: warn
