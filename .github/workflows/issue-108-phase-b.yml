name: Issue 108 Phase B pure effect

on:
  push:
    branches:
      - feat/issue-108-phase-b-pure-effect
  pull_request:
    branches:
      - exp/issue-108-phase-a-grounding-characterization
      - main
    paths:
      - 'game/scripts/objects/procedural_rock_shape_descriptor.gd'
      - 'game/scripts/terrain/terrain_object_effect.gd'
      - 'game/scripts/terrain/terrain_object_effect_index.gd'
      - 'game/tests/issue108_phase_b_pure_effect_tests.gd'
      - 'game/tests/experiments/issue108_*'
      - 'docs/experiments/ISSUE-108-PHASE-B/**'
      - '.github/workflows/issue-108-phase-b.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Import
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path game --import 2>&1 | tee /tmp/import.log

      - name: Phase B pure effect qualification
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM 180s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/issue108_phase_b_pure_effect_tests.gd 2>&1 | tee /tmp/phase-b.log
          grep -q 'ISSUE108_PHASE_B_PASS' /tmp/phase-b.log

      - name: Frozen Phase A geometry contract
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/experiments/issue108_grounding_characterization.gd 2>&1 | tee /tmp/phase-a-grounding.log
          grep -q 'ISSUE108_PHASE_A_PASS' /tmp/phase-a-grounding.log
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/experiments/issue108_halfspace_envelope_characterization.gd 2>&1 | tee /tmp/phase-a-halfspace.log
          grep -q 'ISSUE108_PHASE_A_HALFSPACE_PASS' /tmp/phase-a-halfspace.log
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/experiments/issue108_contact_formula_characterization.gd 2>&1 | tee /tmp/phase-a-contact.log
          grep -q 'ISSUE108_PHASE_A_CONTACT_FORMULA_PASS' /tmp/phase-a-contact.log

      - name: Mod-first and procedural object regressions
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/declarative_mod_tests.gd 2>&1 | tee /tmp/declarative.log
          grep -q 'DECLARATIVE_MOD_PASS' /tmp/declarative.log
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/procedural_object_tests.gd 2>&1 | tee /tmp/procedural.log
          grep -q 'PROCEDURAL_OBJECT_PASS' /tmp/procedural.log

      - name: Canonical validation
        shell: bash
        run: |
          set -o pipefail
          GODOT_BIN=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64 bash scripts/validate.sh 2>&1 | tee /tmp/validate.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue108-phase-b-evidence
          path: |
            /tmp/import.log
            /tmp/phase-b.log
            /tmp/phase-a-*.log
            /tmp/declarative.log
            /tmp/procedural.log
            /tmp/validate.log
