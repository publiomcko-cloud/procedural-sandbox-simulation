name: P4.0C tier routing policy

on:
  pull_request:
    branches:
      - main
    paths:
      - 'game/scripts/simulation/simulation_tier_router.gd'
      - 'game/scripts/simulation/simulation_runtime.gd'
      - 'game/tests/p4_0c_simulation_tier_router_tests.gd'
      - 'game/tests/p4_0b_simulation_tier_tests.gd'
      - 'scripts/ci/run-p4-0c-qualification.ps1'
      - 'scripts/ci/run-p4-0b-qualification.ps1'
      - 'docs/specs/P4-0C-TIER-ROUTING-POLICY.md'
      - '.github/workflows/p4-0c-tier-routing-policy.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 85

    env:
      GODOT_BIN: 'C:\Tools\Godot\Godot_v4.7.2-stable_win64_console.exe'

    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Verify runner and pinned Godot
        shell: cmd
        run: |
          @echo off
          echo RUNNER_NAME=%RUNNER_NAME%
          echo RUNNER_OS=%RUNNER_OS%
          echo RUNNER_ARCH=%RUNNER_ARCH%
          if /I not "%RUNNER_OS%"=="Windows" exit /b 1
          if /I not "%RUNNER_ARCH%"=="X64" exit /b 1
          if not exist "%GODOT_BIN%" exit /b 1
          "%GODOT_BIN%" --version
          if errorlevel 1 exit /b 1

      - name: Run P4.0C qualification envelope
        shell: cmd
        timeout-minutes: 80
        run: |
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\scripts\ci\run-p4-0c-qualification.ps1" -GodotBin "%GODOT_BIN%"
          if errorlevel 1 exit /b 1

      - name: Upload P4.0C evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p4-0c-self-hosted-windows-evidence
          path: |
            ${{ runner.temp }}\p4-0c-evidence\*.log
            ${{ runner.temp }}\p4-0b-evidence\*.log
            ${{ runner.temp }}\p4-0a-evidence\*.log
          if-no-files-found: warn
          retention-days: 7
