name: Mod-first hardening pre-108

on:
  push:
    branches:
      - arch/mod-first-hardening-pre-108
  pull_request:
    branches:
      - main
    paths:
      - 'game/scripts/modding/**'
      - 'game/scripts/objects/**'
      - 'game/scripts/entities/**'
      - 'game/mods/**'
      - 'mods/examples/**'
      - 'game/tests/**'
      - 'docs/specs/MOD-FIRST-RUNTIME-CONTRACT.md'
      - '.github/workflows/mod-first-hardening.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Import
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path game --import 2>&1 | tee /tmp/import.log

      - name: Declarative mod contract
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/declarative_mod_tests.gd 2>&1 | tee /tmp/declarative-mod.log
          grep -q 'DECLARATIVE_MOD_PASS' /tmp/declarative-mod.log

      - name: Procedural object and population qualification
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/procedural_object_tests.gd 2>&1 | tee /tmp/procedural-object.log
          grep -q 'PROCEDURAL_OBJECT_PASS' /tmp/procedural-object.log

      - name: Playable entity command regression
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/playable_entity_command_tests.gd 2>&1 | tee /tmp/playable-entity.log
          grep -q 'PLAYABLE_ENTITY_COMMAND_PASS' /tmp/playable-entity.log

      - name: Entity command harness regression
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/entity_command_harness_tests.gd 2>&1 | tee /tmp/entity-harness.log
          grep -q 'ENTITY_COMMAND_HARNESS_PASS' /tmp/entity-harness.log

      - name: Precise placement regression
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/p3_0d_entity_placement_tests.gd 2>&1 | tee /tmp/entity-placement.log
          grep -q 'P3_0D_ENTITY_PLACEMENT_PASS' /tmp/entity-placement.log

      - name: Runtime performance baseline
        shell: bash
        run: |
          set -o pipefail
          for i in 1 2 3; do
            echo "=== MOD_FIRST_RUNTIME_PERF_RUN=$i ==="
            /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/experiments/runtime_performance_baseline.gd 2>&1 | tee "/tmp/runtime-performance-$i.log"
            grep -q 'RUNTIME_PERFORMANCE_BASELINE_PASS' "/tmp/runtime-performance-$i.log"
          done

      - name: Canonical validation
        shell: bash
        run: |
          set -o pipefail
          GODOT_BIN=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64 bash scripts/validate.sh 2>&1 | tee /tmp/validate.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mod-first-hardening-evidence
          path: |
            /tmp/import.log
            /tmp/declarative-mod.log
            /tmp/procedural-object.log
            /tmp/playable-entity.log
            /tmp/entity-harness.log
            /tmp/entity-placement.log
            /tmp/runtime-performance-*.log
            /tmp/validate.log
