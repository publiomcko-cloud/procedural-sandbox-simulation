name: P5 E3 revision-gated readiness cache experiment (DO NOT MERGE)

on:
  workflow_dispatch:

concurrency:
  group: p5-e3-ready-cache-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualify:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 18
    env:
      GODOT_BIN: 'C:\Tools\Godot\Godot_v4.7.2-stable_win64_console.exe'
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact source and run cache, policy, scene, and runtime tests
        shell: cmd
        timeout-minutes: 12
        run: |
          @echo off
          git rev-parse HEAD
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\scripts\ci\run-p5-stream-ready-cache-qualification.ps1" -GodotBin "%GODOT_BIN%"
          if errorlevel 1 exit /b 1
      - name: Save focused readiness-cache qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p5-e3-qualification-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}\p5-ready-cache-qualification\*.log
            ${{ runner.temp }}\p5-e2-evidence\*.log
            ${{ runner.temp }}\p5-0f-evidence\*.log
            ${{ runner.temp }}\p5-0e-evidence\*.log
            ${{ runner.temp }}\p5-0d-evidence\*.log
            ${{ runner.temp }}\p5-0c-evidence\*.log
            ${{ runner.temp }}\p5-0b-evidence\*.log
            ${{ runner.temp }}\p5-0a-evidence\*.log
            ${{ runner.temp }}\p4-0h-evidence\*.log
            ${{ runner.temp }}\p4-0g-evidence\*.log
            ${{ runner.temp }}\p4-0f-evidence\*.log
            ${{ runner.temp }}\p4-0e-evidence\*.log
            ${{ runner.temp }}\p4-0d-evidence\*.log
            ${{ runner.temp }}\p4-0c-evidence\*.log
            ${{ runner.temp }}\p4-0b-evidence\*.log
            ${{ runner.temp }}\p4-0a-evidence\*.log
          if-no-files-found: warn
          retention-days: 14

  benchmark:
    needs: qualify
    # Explicit runner label: both Windows runners otherwise match the defaults.
    runs-on: [self-hosted, Windows, X64, gpu-interactive]
    timeout-minutes: 45
    env:
      GODOT_BIN: 'C:\Tools\Godot\Godot_v4.7.2-stable_win64_console.exe'
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
      - name: Verify GPU runner identity and import Godot script registry
        shell: cmd
        timeout-minutes: 8
        run: |
          @echo off
          echo Runner=%RUNNER_NAME%
          if /I not "%RUNNER_NAME%"=="sandbox-gpu-interactive" exit /b 1
          "%GODOT_BIN%" --headless --editor --path .\game --import
          if errorlevel 1 exit /b 1
          "%GODOT_BIN%" --headless --path .\game --check-only --script res://scripts/terrain/terrain_demo.gd
          if errorlevel 1 exit /b 1
      - name: Run 16 controlled E3 A/B/B/A routes and record explicit verdict
        shell: cmd
        timeout-minutes: 40
        run: |
          @echo off
          git rev-parse HEAD
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\scripts\perf\run-p5-ready-cache-abba.ps1" -GodotBin "%GODOT_BIN%" -Frames 720
          if errorlevel 1 exit /b 1
      - name: Save all benchmark traces and performance verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p5-e3-ready-cache-abba-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}\p5-ready-cache-abba\*.log
            ${{ runner.temp }}\p5-ready-cache-abba\*.json
          if-no-files-found: warn
          retention-days: 14

  inherited-regressions:
    needs: benchmark
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 210
    env:
      GODOT_BIN: 'C:\Tools\Godot\Godot_v4.7.2-stable_win64_console.exe'
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
      - name: Inherited E2 and all P4/P5 regression contracts
        shell: cmd
        timeout-minutes: 195
        run: |
          @echo off
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\scripts\ci\run-p5-stream-coarse-qualification.ps1" -GodotBin "%GODOT_BIN%"
          if errorlevel 1 exit /b 1
      - name: Upload inherited P4/P5 regression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p5-e3-inherited-regression-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}\p5-e2-evidence\*.log
            ${{ runner.temp }}\p5-0f-evidence\*.log
            ${{ runner.temp }}\p5-0e-evidence\*.log
            ${{ runner.temp }}\p5-0d-evidence\*.log
            ${{ runner.temp }}\p5-0c-evidence\*.log
            ${{ runner.temp }}\p5-0b-evidence\*.log
            ${{ runner.temp }}\p5-0a-evidence\*.log
            ${{ runner.temp }}\p4-0h-evidence\*.log
            ${{ runner.temp }}\p4-0g-evidence\*.log
            ${{ runner.temp }}\p4-0f-evidence\*.log
            ${{ runner.temp }}\p4-0e-evidence\*.log
            ${{ runner.temp }}\p4-0d-evidence\*.log
            ${{ runner.temp }}\p4-0c-evidence\*.log
            ${{ runner.temp }}\p4-0b-evidence\*.log
            ${{ runner.temp }}\p4-0a-evidence\*.log
          if-no-files-found: warn
          retention-days: 14
