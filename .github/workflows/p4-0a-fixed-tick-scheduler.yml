name: P4.0A fixed tick scheduler

on:
  pull_request:
    branches:
      - main
    paths:
      - 'game/scripts/simulation/**'
      - 'game/scenes/terrain_demo.tscn'
      - 'game/tests/p4_0a_fixed_tick_scheduler_tests.gd'
      - 'game/tests/m4_0_mod_first_core_tests.gd'
      - 'game/tests/declarative_mod_tests.gd'
      - 'game/tests/entity_command_tests.gd'
      - 'game/tests/issue108_d8_lod1_terrain_effect_tests.gd'
      - 'game/tests/p3_0d_entity_placement_tests.gd'
      - 'game/tests/procedural_object_tests.gd'
      - 'scripts/ci/run-p4-0a-qualification.ps1'
      - 'docs/specs/P4-0A-FIXED-TICK-SCHEDULER.md'
      - '.github/workflows/p4-0a-fixed-tick-scheduler.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 75

    env:
      GODOT_BIN: 'C:\Tools\Godot\Godot_v4.7.2-stable_win64_console.exe'

    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Verify runner and pinned Godot
        shell: pwsh
        run: |
          Write-Output "RUNNER_NAME=$env:RUNNER_NAME"
          Write-Output "RUNNER_OS=$env:RUNNER_OS"
          Write-Output "RUNNER_ARCH=$env:RUNNER_ARCH"
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') {
            Write-Error "Unexpected runner platform: $env:RUNNER_OS/$env:RUNNER_ARCH"
            exit 1
          }
          if (-not (Test-Path -LiteralPath $env:GODOT_BIN -PathType Leaf)) {
            Write-Error "Godot executable not found: $env:GODOT_BIN"
            exit 1
          }
          $version = (& $env:GODOT_BIN --version 2>&1 | Out-String).Trim()
          Write-Output "GODOT_VERSION=$version"
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^4\.7\.2\.stable(?:\.|$)') {
            Write-Error "Godot 4.7.2 stable verification failed"
            exit 1
          }

      - name: Run P4.0A qualification envelope
        shell: pwsh
        timeout-minutes: 70
        run: |
          & .\scripts\ci\run-p4-0a-qualification.ps1 -GodotBin $env:GODOT_BIN
          exit $LASTEXITCODE

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p4-0a-self-hosted-windows-evidence
          path: ${{ runner.temp }}\p4-0a-evidence\*.log
          if-no-files-found: warn
          retention-days: 7
