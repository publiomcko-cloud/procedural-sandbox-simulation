name: Issue 108 D5.2 placement refresh decoupling

on:
  push:
    branches:
      - perf/issue-108-d5-2-decouple-placement-refresh
  workflow_dispatch:
permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Import
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path game --import 2>&1 | tee /tmp/import.log
          ! grep -q 'SCRIPT ERROR:' /tmp/import.log

      - name: D5.2 focused qualification
        shell: bash
        run: |
          set -o pipefail
          SANDBOX_PERF_TRACE=1 SANDBOX_PERF_TRACE_MIN_MS=0 timeout --signal=TERM 300s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/issue108_d5_2_placement_refresh_decoupling_tests.gd 2>&1 | tee /tmp/d5-2.log
          grep -q 'ISSUE108_D5_2_PLACEMENT_DECOUPLING_PASS' /tmp/d5-2.log
          ! grep -q 'SCRIPT ERROR:' /tmp/d5-2.log
          ! grep -q 'ERROR: FAIL:' /tmp/d5-2.log

      - name: D5.1 regression
        shell: bash
        run: |
          set -o pipefail
          SANDBOX_PERF_TRACE=1 SANDBOX_PERF_TRACE_MIN_MS=0 timeout --signal=TERM 300s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/issue108_d5_1_region_publish_profile_tests.gd 2>&1 | tee /tmp/d5-1.log
          grep -q 'ISSUE108_D5_1_REGION_PUBLISH_PASS' /tmp/d5-1.log
          ! grep -q 'SCRIPT ERROR:' /tmp/d5-1.log
          ! grep -q 'ERROR: FAIL:' /tmp/d5-1.log

      - name: D5 regression
        shell: bash
        run: |
          set -o pipefail
          SANDBOX_PERF_TRACE=1 SANDBOX_PERF_TRACE_MIN_MS=0 timeout --signal=TERM 300s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/issue108_d5_terrain_pacing_tests.gd 2>&1 | tee /tmp/d5.log
          grep -q 'ISSUE108_D5_TERRAIN_PACING_PASS' /tmp/d5.log
          ! grep -q 'SCRIPT ERROR:' /tmp/d5.log
          ! grep -q 'ERROR: FAIL:' /tmp/d5.log

      - name: Terrain concurrency regression
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM 300s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/terrain_concurrency_tests.gd 2>&1 | tee /tmp/concurrency.log
          grep -q 'TERRAIN_CONCURRENCY_PASS' /tmp/concurrency.log
          ! grep -q 'SCRIPT ERROR:' /tmp/concurrency.log
          ! grep -q 'ERROR: FAIL:' /tmp/concurrency.log

      - name: Canonical validation
        shell: bash
        run: |
          set -o pipefail
          GODOT_BIN=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64 bash scripts/validate.sh 2>&1 | tee /tmp/validate.log
          grep -q 'VALIDATION_PASS' /tmp/validate.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue108-d5-2-evidence
          path: |
            /tmp/import.log
            /tmp/d5-2.log
            /tmp/d5-1.log
            /tmp/d5.log
            /tmp/concurrency.log
            /tmp/validate.log
