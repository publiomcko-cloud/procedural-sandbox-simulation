name: D2 diagnostic exact D1 base procedural object

on:
  push:
    branches:
      - diag/issue-108-d2-base-procedural-object

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify base
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "6bc237a7440969049f440a32d114b44863f2b830"
      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Import
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path game --import 2>&1 | tee /tmp/import.log
          ! grep -q 'SCRIPT ERROR:' /tmp/import.log
      - name: Exact procedural object qualification
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM 240s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/procedural_object_tests.gd 2>&1 | tee /tmp/procedural-object.log
          grep -q 'PROCEDURAL_OBJECT_PASS' /tmp/procedural-object.log
          ! grep -q 'ERROR: FAIL:' /tmp/procedural-object.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d2-base-procedural-object-evidence
          path: |
            /tmp/import.log
            /tmp/procedural-object.log
