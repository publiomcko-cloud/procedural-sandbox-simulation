name: F2 G1 LT1 trusted-local inert source-only
on:
  push:
    branches: [feat/f2-g1-lt1-trusted-local-synthetic-v1]
    paths:
      - 'scripts/f2-acl/lt1/**'
      - '.github/workflows/f2-g1-lt1-source-only.yml'
      - 'docs/handoffs/F2_G1_LT1_SOURCE_ONLY_IMPLEMENTATION.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lt1-inert-windows-ps51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Execute LT1 in-memory synthetic regression suite
        shell: powershell
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\scripts\f2-acl\lt1\Test-F2G1LT1.SourceOnly.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Inert CLI positive and filtered token
        shell: powershell
        run: |
          foreach ($profile in @('Standard','FilteredLimited')) {
            & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\scripts\f2-acl\lt1\Invoke-F2G1LT1.SourceOnly.ps1" -MockTokenProfile $profile
            if ($LASTEXITCODE -ne 0) { throw "LT1 mock failed: $profile" }
          }
      - name: Inert CLI negative token and content
        shell: powershell
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\scripts\f2-acl\lt1\Invoke-F2G1LT1.SourceOnly.ps1" -MockTokenProfile Elevated
          if ($LASTEXITCODE -ne 2) { throw 'Elevated mock did not fail closed' }
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\scripts\f2-acl\lt1\Invoke-F2G1LT1.SourceOnly.ps1" -SyntheticFault WrongHash
          if ($LASTEXITCODE -ne 2) { throw 'Changed mock content did not fail closed' }
          exit 0
      - name: Retain R2 historical fixture regression
        shell: powershell
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\scripts\f2-acl\Test-F2G1CPostfailureAttestation.SourceOnly.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Whitespace check against parent
        shell: powershell
        run: |
          git diff --check 29f90ef9b2310044e64d3acd775534559a404425 HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
