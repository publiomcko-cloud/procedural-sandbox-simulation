name: Runtime performance baseline

on:
  push:
    branches:
      - perf/p3-1-streaming-edit-latency
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip             https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64

      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64             --headless --editor --path game --quit             2>&1 | tee /tmp/import.log

      - name: Run runtime performance baseline
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM 180s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64             --headless --path game             --script res://tests/experiments/runtime_performance_baseline.gd             2>&1 | tee /tmp/runtime-performance.log
          grep -q 'RUNTIME_PERFORMANCE_BASELINE_PASS' /tmp/runtime-performance.log

      - name: Upload baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-performance-baseline
          path: |
            /tmp/import.log
            /tmp/runtime-performance.log
