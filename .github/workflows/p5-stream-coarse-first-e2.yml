name: P5 streaming E2 coarse-first (DO NOT MERGE)

on:
  push:
    branches:
      - exp/p5-stream-coarse-first-e2
  workflow_dispatch:

concurrency:
  group: p5-stream-coarse-first-e2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualify:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 210
    env:
      GODOT_BIN: 'C:\Tools\Godot\Godot_v4.7.2-stable_win64_console.exe'
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact commit, operating system and pinned runtime
        shell: cmd
        run: |
          @echo off
          git rev-parse HEAD
          if errorlevel 1 exit /b 1
          if /I not "%RUNNER_OS%"=="Windows" exit /b 1
          if not exist "%GODOT_BIN%" exit /b 1
          "%GODOT_BIN%" --version
          if errorlevel 1 exit /b 1
      - name: Qualify E2 parser, worker, real headless scene and all inherited P5/P4 suites
        shell: cmd
        timeout-minutes: 205
        run: |
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\scripts\ci\run-p5-stream-coarse-qualification.ps1" -GodotBin "%GODOT_BIN%"
          if errorlevel 1 exit /b 1
      - name: Upload E2 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p5-stream-e2-qualification
          path: |
            ${{ runner.temp }}\p5-e2-evidence\*.log
            ${{ runner.temp }}\p5-0f-evidence\*.log
            ${{ runner.temp }}\p5-0e-evidence\*.log
            ${{ runner.temp }}\p5-0d-evidence\*.log
            ${{ runner.temp }}\p5-0c-evidence\*.log
            ${{ runner.temp }}\p5-0b-evidence\*.log
            ${{ runner.temp }}\p5-0a-evidence\*.log
            ${{ runner.temp }}\p4-0h-evidence\*.log
            ${{ runner.temp }}\p4-0g-evidence\*.log
            ${{ runner.temp }}\p4-0f-evidence\*.log
            ${{ runner.temp }}\p4-0e-evidence\*.log
            ${{ runner.temp }}\p4-0d-evidence\*.log
            ${{ runner.temp }}\p4-0c-evidence\*.log
            ${{ runner.temp }}\p4-0b-evidence\*.log
            ${{ runner.temp }}\p4-0a-evidence\*.log
          if-no-files-found: warn
          retention-days: 14
