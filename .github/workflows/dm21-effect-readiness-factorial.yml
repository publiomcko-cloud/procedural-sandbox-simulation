name: DM21 effect readiness and in-flight stage retention factorial - 18mps
on:
  push:
    branches:
      - exp/dm21-effect-readiness-and-stage-retention
  workflow_dispatch:
concurrency:
  group: dm21-cold-factorial
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  exact:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    env:
      GODOT_BIN: 'C:\Tools\Godot\Godot_v4.7.2-stable_win64_console.exe'
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
      - name: PowerShell 5.1 syntax and Godot 4.7.2 parser
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $p = (Resolve-Path .\scripts\perf\run-dm21-factorial.ps1).Path
          $tokens=$null
          $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile($p,[ref]$tokens,[ref]$errors)
          if($errors.Count -gt 0){ Write-Host ($errors | Out-String); throw 'DM21_POWERSHELL_PARSE_FAIL' }
          & $env:GODOT_BIN --headless --editor --path .\game --import
          if($LASTEXITCODE -ne 0){throw 'DM21_IMPORT_FAIL'}
          foreach($file in @(
            'res://scripts/terrain/dm21_effect_wait_gate.gd',
            'res://scripts/terrain/dm21_stage_retention.gd',
            'res://scripts/terrain/terrain_demo.gd',
            'res://scripts/terrain/terrain_object_effect_runtime.gd',
            'res://tests/experiments/dm21_effect_and_retention_contract.gd'
          )){
            & $env:GODOT_BIN --headless --path .\game --check-only --script $file
            if($LASTEXITCODE -ne 0){throw "DM21_SCRIPT_PARSE_FAILED $file"}
          }
          Write-Host 'DM21_PARSE_PASS'
      - name: DM21 notification identity, bounded load retention and canonical parity
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          foreach($case in @(
            @{file='res://tests/experiments/dm21_effect_and_retention_contract.gd';receipt='DM21_CONTRACT_PASS'},
            @{file='res://tests/experiments/dm19_cold_attribution_contract.gd';receipt='DM19_COLD_PROFILE_PASS'},
            @{file='res://tests/experiments/dm18_canonical_cache_contract.gd';receipt='DM18_CANONICAL_CACHE_PASS'},
            @{file='res://tests/experiments/dm17_sparse_lattice_contract.gd';receipt='DM17_SPARSE_LATTICE_PASS'},
            @{file='res://tests/experiments/dm11_canonical_b4_parity.gd';receipt='DM11_CANONICAL_PARITY_PASS'},
            @{file='res://tests/issue108_d7_3_projection_source_cache_tests.gd';receipt='PASS'}
          )){
            $out=& $env:GODOT_BIN --headless --path .\game --script $case.file 2>&1 | Out-String
            Write-Host $out
            if($LASTEXITCODE -ne 0 -or -not $out.Contains($case.receipt) -or
               $out -match 'SCRIPT ERROR:|Parse Error:|DM21_CONTRACT_FAIL:'){
              throw "DM21_EXACT_FAILED $($case.file)"
            }
          }
          Write-Host 'DM21_ALL_CONTRACTS_PASS'

  smoke:
    needs: exact
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35
    env: &bench_env
      GODOT_BIN: 'C:\Tools\Godot\Godot_v4.7.2-stable_win64_console.exe'
      SANDBOX_TERRAIN_BACKEND: b4
      SANDBOX_DM9_FAST_B4: '1'
      SANDBOX_DM9_PREFETCH: '0'
      SANDBOX_DM9_VISUAL_ADAPTIVE: '1'
      SANDBOX_DM9_VISUAL_WORKERS: '4'
      SANDBOX_DM11_CANONICAL_FAST_B4: '1'
      SANDBOX_DM11_VISUAL_LANE: '0'
      SANDBOX_DM12_SURFACE_SLICE: '1'
      SANDBOX_DM12_FRAME_TRACE: '0'
      SANDBOX_DM13_WATER_WORKERS: '1'
      SANDBOX_DM13_WATER_NATIVE: '1'
      SANDBOX_DM14_DENSE_REQUIRED: '1'
      SANDBOX_DM14_LAZY_ROUTES: '0'
      SANDBOX_DM15_DORMANT_ROLLUP: '1'
      SANDBOX_DM15_RELEASE_TRACE: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
      - name: Engine import
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          & $env:GODOT_BIN --headless --editor --path .\game --import
          if($LASTEXITCODE -ne 0){throw 'DM21_SMOKE_IMPORT_FAILED'}
      - name: 16-trial cold and warm smoke, four independent arms
        timeout-minutes: 30
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          & .\scripts\perf\run-dm21-factorial.ps1 -GodotBin $env:GODOT_BIN -EvidenceDir (Join-Path $env:RUNNER_TEMP 'dm21-smoke') -ColdBlocks 2 -WarmBlocks 2 -LongBlocks 0 -IdleBlocks 0
          if($LASTEXITCODE -ne 0){throw 'DM21_SMOKE_FAIL'}
          Write-Host 'DM21_SMOKE_PASS'
      - name: Preserve smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dm21-smoke-evidence
          path: |
            ${{ runner.temp }}\dm21-smoke\**\*.log
            ${{ runner.temp }}\dm21-smoke\**\*.json
            ${{ runner.temp }}\dm21-smoke\*.json
          retention-days: 21
          if-no-files-found: warn

  factorial:
    needs: smoke
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 80
    env: *bench_env
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
      - name: Engine import
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          & $env:GODOT_BIN --headless --editor --path .\game --import
          if($LASTEXITCODE -ne 0){throw 'DM21_FACTORIAL_IMPORT_FAILED'}
      - name: 56-trial control, event-gate, stage-retention and combined at 18mps
        timeout-minutes: 75
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          & .\scripts\perf\run-dm21-factorial.ps1 -GodotBin $env:GODOT_BIN -EvidenceDir (Join-Path $env:RUNNER_TEMP 'dm21-factorial') -ColdBlocks 6 -WarmBlocks 4 -LongBlocks 2 -IdleBlocks 2
          if($LASTEXITCODE -ne 0){throw 'DM21_FACTORIAL_FAILED'}
          Write-Host 'DM21_FACTORIAL_PASS'
      - name: Archive every trial, block and inference
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dm21-factorial-evidence
          path: |
            ${{ runner.temp }}\dm21-factorial\**\*.log
            ${{ runner.temp }}\dm21-factorial\**\*.json
            ${{ runner.temp }}\dm21-factorial\*.json
          retention-days: 21
          if-no-files-found: warn
