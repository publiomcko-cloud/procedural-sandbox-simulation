name: Issue 108 Phase A characterization

on:
  push:
    branches:
      - exp/issue-108-phase-a-grounding-characterization
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase-a:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Import
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path game --import 2>&1 | tee /tmp/import.log

      - name: Canonical baseline
        shell: bash
        run: |
          set -o pipefail
          GODOT_BIN=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64 bash scripts/validate.sh 2>&1 | tee /tmp/validate.log

      - name: Procedural object baseline
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/procedural_object_tests.gd 2>&1 | tee /tmp/procedural-object.log
          grep -q 'PROCEDURAL_OBJECT_PASS' /tmp/procedural-object.log

      - name: Runtime performance baseline x3
        shell: bash
        run: |
          set -o pipefail
          for i in 1 2 3; do
            echo "=== ISSUE108_PHASE_A_RUNTIME_BASELINE_RUN=$i ==="
            timeout --signal=TERM 180s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/experiments/runtime_performance_baseline.gd 2>&1 | tee "/tmp/runtime-performance-$i.log"
            grep -q 'RUNTIME_PERFORMANCE_BASELINE_PASS' "/tmp/runtime-performance-$i.log"
          done

      - name: Grounding geometry characterization
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/experiments/issue108_grounding_characterization.gd 2>&1 | tee /tmp/issue108-phase-a.log
          grep -q 'ISSUE108_PHASE_A_PASS' /tmp/issue108-phase-a.log

      - name: Upload Phase A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue108-phase-a-evidence
          path: |
            /tmp/import.log
            /tmp/validate.log
            /tmp/procedural-object.log
            /tmp/runtime-performance-*.log
            /tmp/issue108-phase-a.log
