name: P5 E7 progressive authoritative chunks (DO NOT MERGE)

on:
  push:
    branches:
      - exp/p5-stream-progressive-chunks-e7

concurrency:
  group: p5-progressive-e7-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualify:
    runs-on: [self-hosted, Windows, X64, gpu-interactive]
    timeout-minutes: 25
    env:
      GODOT_BIN: 'C:\Tools\Godot\Godot_v4.7.2-stable_win64_console.exe'
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
      - name: Qualify exact source revisions, per-chunk provisional visibility, and coarse patches
        shell: cmd
        timeout-minutes: 21
        run: |
          @echo off
          echo E7_RUNNER=%RUNNER_NAME%
          if /I not "%RUNNER_NAME%"=="sandbox-gpu-interactive" exit /b 1
          git rev-parse HEAD
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\scripts\ci\run-p5-progressive-e7-qualification.ps1" -GodotBin "%GODOT_BIN%"
          if errorlevel 1 exit /b 1
      - name: Preserve Godot import, parity, preview and lifecycle smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p5-e7-qualification-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}\p5-e7-qualification\*.log
          if-no-files-found: warn
          retention-days: 14
