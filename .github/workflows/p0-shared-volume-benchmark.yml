name: P2 GDScript allocation benchmark

on:
  push:
    branches:
      - perf/p2-gdscript-allocation-reduction
  workflow_dispatch:
permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path game --quit 2>&1 | tee /tmp/import.log

      - name: Shared-surface geometry qualification
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM 180s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/experiments/global_shared_surface_qualification.gd 2>&1 | tee /tmp/shared-surface.log
          grep -q 'GLOBAL_SHARED_SURFACE_PASS' /tmp/shared-surface.log

      - name: P1 incremental equivalence qualification
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM 180s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/experiments/p1_incremental_shared_surface_qualification.gd 2>&1 | tee /tmp/p1-incremental.log
          grep -q 'P1_INCREMENTAL_SHARED_PASS' /tmp/p1-incremental.log

      - name: Runtime performance samples
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            echo "=== P2_BENCHMARK_RUN=$i ==="
            timeout --signal=TERM 180s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/experiments/runtime_performance_baseline.gd 2>&1 | tee "/tmp/runtime-performance-$i.log"
            grep -q 'RUNTIME_PERFORMANCE_BASELINE_PASS' "/tmp/runtime-performance-$i.log"
          done

      - name: Repeated shared-surface benchmark
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM 180s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/experiments/p1_shared_repeat_benchmark.gd 2>&1 | tee /tmp/p1-shared-repeat.log
          grep -q 'P1_SHARED_REPEAT_BENCHMARK_PASS' /tmp/p1-shared-repeat.log

      - name: Full validation
        shell: bash
        run: |
          set -o pipefail
          GODOT_BIN=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64 bash scripts/validate.sh 2>&1 | tee /tmp/validate.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-gdscript-allocation-benchmark
          path: |
            /tmp/import.log
            /tmp/shared-surface.log
            /tmp/p1-incremental.log
            /tmp/runtime-performance-*.log
            /tmp/validate.log
            /tmp/p1-shared-repeat.log
