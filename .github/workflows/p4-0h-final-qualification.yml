name: P4.0H final P4 qualification

on:
  pull_request:
    branches:
      - feat/p4-0g-deterministic-persistence-replay
      - main
    paths:
      - 'game/scripts/simulation/**'
      - 'game/scripts/terrain/terrain_demo.gd'
      - 'game/tests/p4_0h_cold_boot_probe.gd'
      - 'game/tests/p4_0h_final_qualification_tests.gd'
      - 'scripts/ci/run-p4-0h-qualification.ps1'
      - 'scripts/ci/validate-p4-0h-perf-trace.ps1'
      - 'scripts/validate.sh'
      - 'docs/specs/P4-0H-FINAL-QUALIFICATION.md'
      - '.github/workflows/p4-0h-final-qualification.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    env:
      GODOT_BIN: 'C:\Tools\Godot\Godot_v4.7.2-stable_win64_console.exe'
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
      - name: Verify runner and pinned Godot
        shell: cmd
        run: |
          @echo off
          if /I not "%RUNNER_OS%"=="Windows" exit /b 1
          if /I not "%RUNNER_ARCH%"=="X64" exit /b 1
          if not exist "%GODOT_BIN%" exit /b 1
          "%GODOT_BIN%" --version
          if errorlevel 1 exit /b 1
      - name: Run P4.0H final qualification
        shell: cmd
        timeout-minutes: 115
        run: |
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\scripts\ci\run-p4-0h-qualification.ps1" -GodotBin "%GODOT_BIN%"
          if errorlevel 1 exit /b 1
      - name: Upload P4.0H evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p4-0h-final-evidence
          path: |
            ${{ runner.temp }}\p4-0h-evidence\*.log
            ${{ runner.temp }}\p4-0g-evidence\*.log
            ${{ runner.temp }}\p4-0f-evidence\*.log
            ${{ runner.temp }}\p4-0e-evidence\*.log
            ${{ runner.temp }}\p4-0d-evidence\*.log
            ${{ runner.temp }}\p4-0c-evidence\*.log
            ${{ runner.temp }}\p4-0b-evidence\*.log
            ${{ runner.temp }}\p4-0a-evidence\*.log
          if-no-files-found: warn
          retention-days: 14
