name: Issue 108 D8 LOD1 terrain effects

on:
  push:
    branches:
      - feat/issue-108-d8-lod1-terrain-effects
  pull_request:
    paths:
      - 'game/scripts/terrain/lod01_chunk_mesher.gd'
      - 'game/scripts/terrain/terrain_mesh_job.gd'
      - 'game/tests/issue108_d8_lod1_terrain_effect_tests.gd'
      - 'game/tests/issue108_phase_d_live_integration_tests.gd'
      - 'game/tests/issue108_pre_d_local_frame_tests.gd'
      - 'game/tests/lod01_transition_tests.gd'
      - 'game/tests/p3_0d_entity_placement_tests.gd'
      - 'game/tests/procedural_object_tests.gd'
      - '.github/workflows/issue-108-d8.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Import
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path game --import 2>&1 | tee /tmp/import.log
          ! grep -q 'SCRIPT ERROR:' /tmp/import.log

      - name: D8 focused LOD1 terrain-effect qualification
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM 300s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/issue108_d8_lod1_terrain_effect_tests.gd 2>&1 | tee /tmp/d8.log
          grep -q 'ISSUE108_D8_LOD1_EFFECT_PASS' /tmp/d8.log
          ! grep -q 'SCRIPT ERROR:' /tmp/d8.log
          ! grep -q 'ERROR: FAIL:' /tmp/d8.log

      - name: Phase D and pre-D regressions
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM 300s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/issue108_phase_d_live_integration_tests.gd 2>&1 | tee /tmp/phase-d.log
          grep -q 'ISSUE108_PHASE_D_PASS' /tmp/phase-d.log
          ! grep -q 'SCRIPT ERROR:' /tmp/phase-d.log
          ! grep -q 'ERROR: FAIL:' /tmp/phase-d.log
          timeout --signal=TERM 300s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/issue108_pre_d_local_frame_tests.gd 2>&1 | tee /tmp/pre-d.log
          grep -q 'ISSUE108_PRE_D_PASS' /tmp/pre-d.log
          ! grep -q 'SCRIPT ERROR:' /tmp/pre-d.log
          ! grep -q 'ERROR: FAIL:' /tmp/pre-d.log

      - name: LOD transition regression
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM 300s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/lod01_transition_tests.gd 2>&1 | tee /tmp/lod.log
          grep -q 'LOD01_TRANSITION_PASS' /tmp/lod.log
          ! grep -q 'SCRIPT ERROR:' /tmp/lod.log
          ! grep -q 'ERROR: FAIL:' /tmp/lod.log

      - name: Entity placement regression
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM 600s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/p3_0d_entity_placement_tests.gd 2>&1 | tee /tmp/placement.log
          grep -q 'P3_0D_PLACEMENT_PASS' /tmp/placement.log
          ! grep -q 'SCRIPT ERROR:' /tmp/placement.log
          ! grep -q 'ERROR: FAIL:' /tmp/placement.log

      - name: Procedural object regression
        shell: bash
        run: |
          set -o pipefail
          set +e
          timeout --signal=TERM 600s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/procedural_object_tests.gd 2>&1 | tee /tmp/procedural.log
          test_status=${PIPESTATUS[0]}
          set -e
          ! grep -q 'SCRIPT ERROR:' /tmp/procedural.log
          if grep -q 'PROCEDURAL_OBJECT_PASS' /tmp/procedural.log; then
            test "$test_status" -eq 0
          else
            test "$test_status" -ne 0
            grep -Eq 'PROCEDURAL_OBJECT_FAIL: assertions=[0-9]+ failures=1' /tmp/procedural.log
            grep -q 'ERROR: FAIL: camera-driven revisit republishes the original region' /tmp/procedural.log
            grep -q 'effect_projection_same_revision_fingerprint_conflict' /tmp/procedural.log
            test "$(grep -c 'ERROR: FAIL:' /tmp/procedural.log)" -eq 1
          fi

      - name: Canonical validation
        shell: bash
        run: |
          set -o pipefail
          GODOT_BIN=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64 bash scripts/validate.sh 2>&1 | tee /tmp/validate.log
          grep -q 'VALIDATION_PASS' /tmp/validate.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue108-d8-evidence
          path: |
            /tmp/import.log
            /tmp/d8.log
            /tmp/phase-d.log
            /tmp/pre-d.log
            /tmp/lod.log
            /tmp/placement.log
            /tmp/procedural.log
            /tmp/validate.log
