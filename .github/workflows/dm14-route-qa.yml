name: DM14 final route safety contracts and GPU smoke

on:
  push:
    branches:
      - exp/dm14-lazy-route-qualification
  workflow_dispatch:

concurrency:
  group: dm14-route-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  safety:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    env:
      GODOT_BIN: 'C:\Tools\Godot\Godot_v4.7.2-stable_win64_console.exe'
      SANDBOX_DM14_LAZY_ROUTES: '1'
      SANDBOX_DM14_DENSE_REQUIRED: '1'
      SANDBOX_DM14_EFFECT_TRACE: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
      - name: Import and strict parse
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          & $env:GODOT_BIN --headless --editor --path .\game --import
          if ($LASTEXITCODE -ne 0) { throw 'DM14 import failed' }
          foreach ($file in @(
            'res://scripts/terrain/terrain_object_effect_projection_service.gd',
            'res://scripts/terrain/terrain_object_effect_runtime.gd',
            'res://scripts/terrain/terrain_demo.gd',
            'res://tests/experiments/dm14_lazy_route_cleanup_contract.gd'
          )) {
            & $env:GODOT_BIN --headless --path .\game --check-only --script $file
            if ($LASTEXITCODE -ne 0) { throw "DM14 parse failed $file" }
          }
          Write-Host 'DM14_QA_PARSE_PASS'
      - name: Exact active/inactive source frames, dormant revisit and real effect regressions
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        timeout-minutes: 20
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'dm14-route-qa'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $ErrorActionPreference = 'Continue'
          foreach ($case in @(
            @{name='tombstone'; script='res://tests/experiments/dm14_lazy_route_cleanup_contract.gd'; receipt='DM14_ROUTE_CONTRACT_PASS'},
            @{name='dense'; script='res://tests/experiments/dm14_effect_dense_window_contract.gd'; receipt='DM14_DENSE_CONTRACT_PASS'},
            @{name='dormant'; script='res://tests/issue108_d4_1_dormant_projection_scope_cache_tests.gd'; receipt='ISSUE108_D4_1_DORMANT_SCOPE_PASS'},
            @{name='source-cache'; script='res://tests/issue108_d7_3_projection_source_cache_tests.gd'; receipt='ISSUE108_D7_3_PROJECTION_SOURCE_CACHE_PASS'}
          )) {
            $output = & $env:GODOT_BIN --headless --path .\game --script $case.script 2>&1 | Out-String
            $exitCode = $LASTEXITCODE
            $output | Set-Content (Join-Path $dir "$($case.name).log") -Encoding UTF8
            Write-Host ("DM14_QA_RECEIPT " + $case.name + " matched=" + $output.Contains($case.receipt))
            if ($exitCode -ne 0 -or -not $output.Contains($case.receipt) -or
                $output -match 'SCRIPT ERROR:|Parse Error:|DM14_ROUTE_CONTRACT_FAIL:') {
              throw "DM14 opt-in regression: $($case.name)"
            }
          }
          Write-Host 'DM14_OPT_IN_SAFETY_PASS'
      - name: Retain QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dm14-route-safety
          path: ${{ runner.temp }}\dm14-route-qa\*.log
          retention-days: 14
          if-no-files-found: warn

  gpu:
    needs: safety
    runs-on: [self-hosted, Windows, X64, gpu-interactive]
    timeout-minutes: 30
    env:
      GODOT_BIN: 'C:\Tools\Godot\Godot_v4.7.2-stable_win64_console.exe'
      SANDBOX_TERRAIN_BACKEND: b4
      SANDBOX_DM9_FAST_B4: '1'
      SANDBOX_DM9_PREFETCH: '0'
      SANDBOX_DM9_VISUAL_ADAPTIVE: '1'
      SANDBOX_DM9_VISUAL_WORKERS: '4'
      SANDBOX_DM11_CANONICAL_FAST_B4: '1'
      SANDBOX_DM11_VISUAL_LANE: '0'
      SANDBOX_DM12_SURFACE_SLICE: '1'
      SANDBOX_DM12_FRAME_TRACE: '0'
      SANDBOX_DM13_WATER_WORKERS: '1'
      SANDBOX_DM13_WATER_NATIVE: '1'
      SANDBOX_DM14_DENSE_REQUIRED: '1'
      SANDBOX_DM14_LAZY_ROUTES: '1'
      SANDBOX_DM14_EFFECT_TRACE: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
      - name: Interactive Windows GPU preflight
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          & .\scripts\ci\p5-gpu-session-preflight.ps1 -Role Interactive
      - name: Actual GPU rendering with DM14 effect route cleanup
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        timeout-minutes: 20
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'dm14-route-gpu'
          & .\scripts\perf\run-p5-gpu-smoke.ps1 -GodotBin $env:GODOT_BIN -EvidenceDir $dir -Frames 360 -Routes @('straight-18') -StreamProfile 'adaptive-skip-progressive'
          if ($LASTEXITCODE -ne 0) { throw 'DM14 interactive GPU smoke failed' }
          $log = Get-Content (Join-Path $dir 'gpu-straight-18.stdout.log') -Raw
          if (-not $log.Contains('"event":"effect_window_update"') -or
              -not $log.Contains('"event":"dm4_region_b4_high_visible"')) {
            throw 'DM14 GPU lacked effect window or visual HIGH publication'
          }
          Write-Host 'DM14_INTERACTIVE_GPU_PASS'
      - name: Retain GPU screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dm14-route-gpu
          path: |
            ${{ runner.temp }}\dm14-route-gpu\*.png
            ${{ runner.temp }}\dm14-route-gpu\*.log
            ${{ runner.temp }}\dm14-route-gpu\*.json
          retention-days: 14
          if-no-files-found: warn
