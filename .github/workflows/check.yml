name: Starter checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Validate expected files
        shell: cmd
        run: |
          @echo off
          if not exist "game\project.godot" exit /b 1
          if not exist "game\scenes\main.tscn" exit /b 1
          if not exist "game\tests\smoke.gd" exit /b 1
          echo STATIC_PROJECT_STRUCTURE_PASS
