name: Starter checks
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate expected files
        run: |
          test -f game/project.godot
          test -f game/scenes/main.tscn
          test -f game/tests/smoke.gd
          echo 'Static project structure PASS. Godot runtime validation is NOT performed by this job.'
