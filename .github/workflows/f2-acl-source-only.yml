name: F2 ACL source-only validation
on:
  push:
    branches: [security/f2-acl-capture-issue48]
    paths:
      - 'scripts/f2-acl/**'
      - 'docs/security/F2_G1_ACL_CAPTURE.md'
      - 'docs/reviews/f2-g1-capture-id-contract/**'
      - 'docs/reviews/f2-g1-third-upgrade-manifest-diagnostics/**'
      - 'docs/reviews/f2-g1-elevated-diagnostic-launch/**'
      - '.github/workflows/f2-acl-source-only.yml'
  pull_request:
    paths:
      - 'scripts/f2-acl/**'
      - 'docs/security/F2_G1_ACL_CAPTURE.md'
      - 'docs/reviews/f2-g1-capture-id-contract/**'
      - 'docs/reviews/f2-g1-third-upgrade-manifest-diagnostics/**'
      - 'docs/reviews/f2-g1-elevated-diagnostic-launch/**'
      - '.github/workflows/f2-acl-source-only.yml'
jobs:
  powershell-source-only:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and pin synthetic fixture temporary roots
        id: temp_preflight
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-F2CanonicalLocalPath {
            param([Parameter(Mandatory = $true)][string]$PathValue)
            $full = [IO.Path]::GetFullPath($PathValue)
            $root = [IO.Path]::GetPathRoot($full)
            if ($full.Length -gt $root.Length) { return $full.TrimEnd([char]'\') }
            return $root
          }
          function Assert-F2SafeLocalDirectory {
            param([Parameter(Mandatory = $true)][string]$PathValue)
            if ([string]::IsNullOrWhiteSpace($PathValue) -or $PathValue -match '[\r\n]') { throw 'F2_TEMP_PATH_INVALID' }
            if ($PathValue -notmatch '^[A-Za-z]:\\') { throw 'F2_TEMP_PATH_NOT_LOCAL_ABSOLUTE' }
            $full = Get-F2CanonicalLocalPath -PathValue $PathValue
            $rawComparable = $PathValue
            $rawRoot = [IO.Path]::GetPathRoot($rawComparable)
            if ($rawComparable.Length -gt $rawRoot.Length) { $rawComparable = $rawComparable.TrimEnd([char]'\') }
            if (-not [string]::Equals($rawComparable, $full, [StringComparison]::OrdinalIgnoreCase)) { throw 'F2_TEMP_PATH_NOT_CANONICAL' }
            $root = [IO.Path]::GetPathRoot($full)
            if ($full.Length -le $root.Length) { throw 'F2_TEMP_PATH_IS_VOLUME_ROOT' }
            $drive = [IO.DriveInfo]::new($root)
            if (-not $drive.IsReady -or $drive.DriveType -ne [IO.DriveType]::Fixed) { throw 'F2_TEMP_PATH_DRIVE_NOT_FIXED' }
            $resolved = (Resolve-Path -LiteralPath $full -ErrorAction Stop).Path
            if (-not [string]::Equals((Get-F2CanonicalLocalPath -PathValue $resolved), $full, [StringComparison]::OrdinalIgnoreCase)) { throw 'F2_TEMP_PATH_RESOLUTION_MISMATCH' }
            $current = $root
            $rootItem = Get-Item -LiteralPath $current -Force -ErrorAction Stop
            if (-not $rootItem.PSIsContainer -or (($rootItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0)) { throw 'F2_TEMP_ANCESTOR_REPARSE' }
            $relative = $full.Substring($root.Length)
            foreach ($part in $relative.Split([char]'\')) {
              if ([string]::IsNullOrEmpty($part)) { continue }
              $current = Join-Path $current $part
              $item = Get-Item -LiteralPath $current -Force -ErrorAction Stop
              if (-not $item.PSIsContainer -or (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0)) { throw 'F2_TEMP_ANCESTOR_NOT_REGULAR_DIRECTORY' }
            }
            return $full
          }
          function Test-F2PathWithin {
            param([Parameter(Mandatory = $true)][string]$PathValue, [Parameter(Mandatory = $true)][string]$RootValue)
            $path = Get-F2CanonicalLocalPath -PathValue $PathValue
            $root = Get-F2CanonicalLocalPath -PathValue $RootValue
            if ([string]::Equals($path, $root, [StringComparison]::OrdinalIgnoreCase)) { return $true }
            $prefix = $root.TrimEnd([char]'\') + '\'
            return $path.StartsWith($prefix, [StringComparison]::OrdinalIgnoreCase)
          }
          try {
            $runnerTemp = Assert-F2SafeLocalDirectory -PathValue $env:RUNNER_TEMP
            $originalTemp = Assert-F2SafeLocalDirectory -PathValue $env:TEMP
            $originalTmp = Assert-F2SafeLocalDirectory -PathValue $env:TMP
            $deniedRoots = @(
              $env:SystemRoot,
              $env:ProgramFiles,
              [Environment]::GetEnvironmentVariable('ProgramFiles(x86)'),
              [Environment]::GetFolderPath([Environment+SpecialFolder]::CommonApplicationData),
              'C:\Windows',
              'C:\Program Files',
              'C:\Program Files (x86)',
              'C:\ProgramData',
              'C:\Program Files\F2-G1-Icacls',
              'C:\ProgramData\F2-G1-Icacls',
              'G:\'
            ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
            foreach ($path in @($runnerTemp, $originalTemp, $originalTmp)) {
              foreach ($deniedRoot in $deniedRoots) {
                if (Test-F2PathWithin -PathValue $path -RootValue $deniedRoot) { throw 'F2_TEMP_PATH_IN_PROTECTED_LOCATION' }
              }
            }
            if ([string]::IsNullOrWhiteSpace($env:GITHUB_ENV) -or $env:GITHUB_ENV -notmatch '^[A-Za-z]:\\') { throw 'F2_GITHUB_ENV_PATH_INVALID' }
            $githubEnvPath = [IO.Path]::GetFullPath($env:GITHUB_ENV)
            $githubEnvParent = Assert-F2SafeLocalDirectory -PathValue ([IO.Path]::GetDirectoryName($githubEnvPath))
            if (-not (Test-F2PathWithin -PathValue $githubEnvParent -RootValue $runnerTemp)) { throw 'F2_GITHUB_ENV_OUTSIDE_RUNNER_TEMP' }
            $githubEnvItem = Get-Item -LiteralPath $githubEnvPath -Force -ErrorAction Stop
            if ($githubEnvItem.PSIsContainer -or (($githubEnvItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0)) { throw 'F2_GITHUB_ENV_NOT_REGULAR_FILE' }
            $lineFeed = [string][char]10
            $updates = 'TEMP=' + $runnerTemp + $lineFeed + 'TMP=' + $runnerTemp + $lineFeed
            [IO.File]::AppendAllText($githubEnvPath, $updates, [Text.UTF8Encoding]::new($false))
            Write-Host 'F2TempPreflight=PASS;OriginalTemp=SAFE;OriginalTmp=SAFE;EffectiveTemp=RUNNER_TEMP;EffectiveTmp=RUNNER_TEMP'
          } catch {
            [Console]::Error.WriteLine('F2TempPreflight=FAIL;ErrorClass=UNCLASSIFIED')
            exit 1
          }
      - name: Verify F2 G1 review evidence Git and Windows checkout hashes
        if: github.head_ref != 'feat/f2-g1-diagnostic-elevation-plan-issue48'
        shell: powershell
        run: |
          $testPath = (Resolve-Path '.\docs\reviews\f2-g1-third-upgrade-manifest-diagnostics\Test-F2G1ReviewEvidenceManifest.ps1').Path
          $powershell = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          foreach ($arguments in @(
            @('-NoProfile','-ExecutionPolicy','Bypass','-File',$testPath,'-SelfTest'),
            @('-NoProfile','-ExecutionPolicy','Bypass','-File',$testPath)
          )) {
            $test = Start-Process -FilePath $powershell -ArgumentList $arguments -PassThru -Wait -NoNewWindow
            Write-Host "F2EvidenceManifestProcessExit=$($test.ExitCode)"
            if ($test.ExitCode -ne 0) { exit $test.ExitCode }
          }
      - name: Run F2 ACL synthetic regression suite in Windows PowerShell 5.1
        shell: powershell
        run: |
          $testPath = (Resolve-Path '.\scripts\f2-acl\Test-F2AclCapture.Protocol.ps1').Path
          $test = Start-Process -FilePath "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File',$testPath) -PassThru -Wait -NoNewWindow
          Write-Host "F2AclTestProcessExit=$($test.ExitCode)"
          if ($test.ExitCode -ne 0) { exit $test.ExitCode }
      - name: Run F2 icacls corroboration synthetic suite in Windows PowerShell 5.1
        shell: powershell
        run: |
          $testPath = (Resolve-Path '.\scripts\f2-acl\Test-F2AclIcacls.Corroboration.ps1').Path
          $test = Start-Process -FilePath "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File',$testPath) -PassThru -Wait -NoNewWindow
          Write-Host "F2IcaclsTestProcessExit=$($test.ExitCode)"
          if ($test.ExitCode -ne 0) { exit $test.ExitCode }
      - name: Run F2 icacls runtime-boundary synthetic suite in Windows PowerShell 5.1
        shell: powershell
        run: |
          $testPath = (Resolve-Path '.\scripts\f2-acl\Test-F2AclIcacls.Runtime.ps1').Path
          $test = Start-Process -FilePath "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File',$testPath) -PassThru -Wait -NoNewWindow
          Write-Host "F2IcaclsRuntimeTestProcessExit=$($test.ExitCode)"
          if ($test.ExitCode -ne 0) { exit $test.ExitCode }
      - name: Run PS5.1 StrictMode entrypoint fixtures
        shell: powershell
        run: |
          $testPath = (Resolve-Path '.\scripts\f2-acl\Test-F2AclEntrypointArguments.ps1').Path
          $test = Start-Process -FilePath "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File',$testPath) -PassThru -Wait -NoNewWindow
          Write-Host "F2EntrypointTestProcessExit=$($test.ExitCode)"
          if ($test.ExitCode -ne 0) { exit $test.ExitCode }
      - name: Run protected release updater synthetic suite in Windows PowerShell 5.1
        # This task expressly excludes executing the historical updater, including its synthetic transaction suite.
        if: github.head_ref != 'feat/f2-g1-diagnostic-elevation-plan-issue48'
        shell: powershell
        run: |
          $testPath = (Resolve-Path '.\scripts\f2-acl\Test-F2AclProtectedReleaseUpdater.ps1').Path
          $test = Start-Process -FilePath "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File',$testPath) -PassThru -Wait -NoNewWindow
          Write-Host "F2ProtectedUpdaterTestProcessExit=$($test.ExitCode)"
          if ($test.ExitCode -ne 0) { exit $test.ExitCode }
      - name: Compile and exercise production native helper in Windows PowerShell 5.1 TEMP fixtures
        shell: powershell
        run: |
          $testPath = (Resolve-Path '.\scripts\f2-acl\Test-F2AclProtectedReleaseNativeHelper.ps1').Path
          $test = Start-Process -FilePath "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File',$testPath) -PassThru -Wait -NoNewWindow
          Write-Host "F2NativeHelperTestProcessExit=$($test.ExitCode)"
          if ($test.ExitCode -ne 0) { exit $test.ExitCode }
      # The older create-only installer suite pins the superseded pre-correction
      # seven-file package. It is retained as historical evidence and is not an
      # upgrade path or a validation target for this source-only release change.
      - name: Reproduce historical F2 candidate manifest bootstrap semantics in Windows PowerShell 5.1
        shell: powershell
        run: |
          $testPath = (Resolve-Path '.\scripts\f2-acl\Test-F2HistoricalManifestDiagnostic.ps1').Path
          $test = Start-Process -FilePath "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -ArgumentList @('-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-File',$testPath) -PassThru -Wait -NoNewWindow
          Write-Host "F2HistoricalManifestDiagnosticTestProcessExit=$($test.ExitCode)"
          if ($test.ExitCode -ne 0) { exit $test.ExitCode }
      - name: Run F2 elevated diagnostic launch boundary synthetic suite in Windows PowerShell 5.1
        shell: powershell
        run: |
          $testPath = (Resolve-Path '.\scripts\f2-acl\Test-F2HistoricalManifestLaunch.ps1').Path
          $test = Start-Process -FilePath "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -ArgumentList @('-NoLogo','-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-File',$testPath) -PassThru -Wait -NoNewWindow
          Write-Host "F2HistoricalManifestLaunchTestProcessExit=$($test.ExitCode)"
          if ($test.ExitCode -ne 0) { exit $test.ExitCode }
      - name: Run elevated-child diagnostics channel integration and failure suite in Windows PowerShell 5.1
        if: ${{ !cancelled() && steps.temp_preflight.outcome == 'success' }}
        shell: powershell
        timeout-minutes: 10
        run: |
          $testPath = (Resolve-Path '.\scripts\f2-acl\Test-F2ProtectedReleaseDiagnostics.ps1').Path
          $powershell = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          & $powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $testPath
          $testExit = $LASTEXITCODE
          Write-Host "F2ProtectedDiagnosticsTestProcessExit=$testExit"
          if ($testExit -ne 0) { exit $testExit }
      - name: Parse tracked PowerShell source
        shell: powershell
        run: |
          $files = @(git ls-files 'scripts/f2-acl/*.ps1' 'scripts/f2-acl/*.psm1')
          $failures = @()
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$tokens, [ref]$parseErrors)
            foreach ($errorRecord in $parseErrors) { $failures += "${file}:$($errorRecord.Extent.StartLineNumber): $($errorRecord.Message)" }
          }
          Write-Host "ParserFiles=$($files.Count);ParserErrors=$($failures.Count)"
          $failures | ForEach-Object { Write-Error $_ }
          if ($failures.Count -gt 0) { exit 1 }
      - name: Check whitespace errors
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GITHUB_BASE_REF)) { $base = 'origin/main' } else { $base = "origin/$env:GITHUB_BASE_REF" }
          git diff --check "$base...HEAD"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
