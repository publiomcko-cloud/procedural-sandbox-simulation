name: Issue 108 pre-D precision frame

on:
  push:
    branches:
      - feat/issue-108-pre-d-region-local-effect-frame
  pull_request:
    branches:
      - feat/issue-108-phase-c-effect-projection-recovery
      - feat/issue-108-phase-b-pure-effect
      - main
    paths:
      - 'game/scripts/terrain/terrain_object_effect.gd'
      - 'game/scripts/terrain/terrain_object_effect_index.gd'
      - 'game/scripts/terrain/terrain_object_effect_projection_*.gd'
      - 'game/tests/issue108_pre_d_precision_frame_tests.gd'
      - 'game/tests/issue108_phase_b_pure_effect_tests.gd'
      - 'game/tests/issue108_phase_c_projection_recovery_tests.gd'
      - 'docs/experiments/ISSUE-108-PRE-D/**'
      - '.github/workflows/issue-108-pre-d.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Import
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path game --import 2>&1 | tee /tmp/import.log

      - name: Pre-D precision frame
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/issue108_pre_d_precision_frame_tests.gd 2>&1 | tee /tmp/pre-d.log
          grep -q 'ISSUE108_PRE_D_PASS' /tmp/pre-d.log

      - name: Pure effect and projection recovery
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/issue108_phase_b_pure_effect_tests.gd 2>&1 | tee /tmp/phase-b.log
          grep -q 'ISSUE108_PHASE_B_PASS' /tmp/phase-b.log
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/issue108_phase_c_projection_recovery_tests.gd 2>&1 | tee /tmp/phase-c.log
          grep -q 'ISSUE108_PHASE_C_PASS' /tmp/phase-c.log

      - name: Entity and content regressions
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/entity_command_tests.gd 2>&1 | tee /tmp/entity-command.log
          grep -q 'ENTITY_COMMAND_PASS' /tmp/entity-command.log
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/declarative_mod_tests.gd 2>&1 | tee /tmp/declarative.log
          grep -q 'DECLARATIVE_MOD_PASS' /tmp/declarative.log
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/procedural_object_tests.gd 2>&1 | tee /tmp/procedural.log
          grep -q 'PROCEDURAL_OBJECT_PASS' /tmp/procedural.log

      - name: Canonical validation
        shell: bash
        run: |
          set -o pipefail
          GODOT_BIN=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64 bash scripts/validate.sh 2>&1 | tee /tmp/validate.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue108-pre-d-evidence
          path: |
            /tmp/import.log
            /tmp/pre-d.log
            /tmp/phase-b.log
            /tmp/phase-c.log
            /tmp/entity-command.log
            /tmp/declarative.log
            /tmp/procedural.log
            /tmp/validate.log
