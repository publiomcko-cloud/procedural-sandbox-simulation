name: Architecture alternatives - seam authority and Transvoxel

on:
  pull_request:
    branches:
      - feat/p3-1-scalable-terrain-storage
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  shared-surface:
    name: Shared surface authority / stock Godot 4.7.2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download stock Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3             -o /tmp/godot.zip             https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Import project script classes
        shell: bash
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path game --quit

      - name: Run shared-surface probe
        shell: bash
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64             --headless --path game             --script res://tests/experiments/arch_alt_shared_surface_probe.gd             2>&1 | tee /tmp/shared-surface.log
          grep -q 'ARCH_ALT_SHARED_SURFACE_PASS' /tmp/shared-surface.log

      - name: Upload shared-surface evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-surface-evidence
          path: /tmp/shared-surface.log

  transvoxel:
    name: Canonical SDF into Voxel Tools 1.7 Transvoxel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.7.2 + Voxel Tools 1.7 custom build
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3             https://api.github.com/repos/Zylann/godot_voxel/releases/tags/v1.7             -o /tmp/vt-release.json
          jq -r '.assets[].name' /tmp/vt-release.json | tee /tmp/vt-assets.txt
          ASSET_URL="$(jq -r '
            .assets[]
            | select((.name | ascii_downcase | contains("linux")))
            | select((.name | ascii_downcase | contains("x86_64")))
            | select((.name | ascii_downcase | contains("template") | not))
            | select((.name | ascii_downcase | contains("double") | not))
            | select((.name | ascii_downcase | contains("tracy") | not))
            | .browser_download_url
          ' /tmp/vt-release.json | head -n 1)"
          test -n "$ASSET_URL"
          echo "Selected Voxel Tools asset: $ASSET_URL"
          curl -fL --retry 3 -o /tmp/vt-package "$ASSET_URL"
          mkdir -p /tmp/vt
          if unzip -t /tmp/vt-package >/dev/null 2>&1; then
            unzip -q /tmp/vt-package -d /tmp/vt
          else
            tar -xf /tmp/vt-package -C /tmp/vt
          fi
          VT_GODOT="$(find /tmp/vt -type f \( -iname 'godot*linux*x86_64*' -o -iname 'godot*' \)             ! -name '*.so' ! -name '*.pck' | head -n 1)"
          test -n "$VT_GODOT"
          chmod +x "$VT_GODOT"
          echo "$VT_GODOT" > /tmp/vt-godot-path
          "$VT_GODOT" --version

      - name: Import project script classes with Voxel Tools build
        shell: bash
        run: |
          VT_GODOT="$(cat /tmp/vt-godot-path)"
          "$VT_GODOT" --headless --editor --path game --quit

      - name: Run native Transvoxel probe
        shell: bash
        run: |
          set -o pipefail
          VT_GODOT="$(cat /tmp/vt-godot-path)"
          "$VT_GODOT"             --headless --path game             --script res://tests/experiments/arch_alt_transvoxel_probe.gd             2>&1 | tee /tmp/transvoxel.log
          grep -q 'ARCH_ALT_TRANSVOXEL_PASS' /tmp/transvoxel.log

      - name: Upload Transvoxel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transvoxel-evidence
          path: |
            /tmp/transvoxel.log
            /tmp/vt-assets.txt
