<svg xmlns="http://www.w3.org/2000/svg" width="840" height="390" viewBox="0 0 840 390" role="img" aria-labelledby="title desc">
<title id="title">Headless LOD1 CPU mesh build time</title><desc id="desc">Median CPU mesh build times rise sharply for concentrated operation histories and remain lower for distributed histories. Not GPU or frame time.</desc>
<rect width="840" height="390" fill="#fff"/><text x="420" y="28" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold">LOD1 mesh build — CPU ms, p50 across five repetitions</text>
<text x="14" y="198" transform="rotate(-90 14 198)" text-anchor="middle" font-family="sans-serif" font-size="12">milliseconds (log scale)</text>
<g stroke="#ddd" stroke-width="1" font-family="sans-serif" font-size="11" fill="#444">
<line x1="70" y1="330" x2="810" y2="330"/><line x1="70" y1="260" x2="810" y2="260"/><line x1="70" y1="190" x2="810" y2="190"/><line x1="70" y1="120" x2="810" y2="120"/><line x1="70" y1="50" x2="810" y2="50"/>
<text x="61" y="334" text-anchor="end">10</text><text x="61" y="264" text-anchor="end">100</text><text x="61" y="194" text-anchor="end">1,000</text><text x="61" y="124" text-anchor="end">10,000</text><text x="61" y="54" text-anchor="end">100,000</text>
</g>
<g fill="#3274a1"><rect x="253" y="260" width="22" height="70"/><rect x="393" y="260" width="22" height="70"/><rect x="533" y="255" width="22" height="75"/><rect x="673" y="254" width="22" height="76"/></g>
<g fill="#e1812c"><rect x="279" y="225" width="22" height="105"/><rect x="419" y="202" width="22" height="128"/><rect x="559" y="173" width="22" height="157"/><rect x="699" y="132" width="22" height="198"/></g>
<g font-family="sans-serif" font-size="11" fill="#333" text-anchor="middle"><text x="137" y="350">0</text><text x="277" y="350">256</text><text x="417" y="350">640</text><text x="557" y="350">2,048</text><text x="697" y="350">8,192</text><text x="440" y="375">Accepted operations</text></g>
<g font-family="sans-serif" font-size="12"><rect x="240" y="43" width="12" height="12" fill="#3274a1"/><text x="258" y="54">Distributed</text><rect x="350" y="43" width="12" height="12" fill="#e1812c"/><text x="368" y="54">Concentrated</text></g>
<text x="420" y="388" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#555">Log scale; values from the checked-in JSONL. This is headless CPU construction, not rendered frame time.</text>
