<svg xmlns="http://www.w3.org/2000/svg" width="840" height="360" viewBox="0 0 840 360" role="img" aria-labelledby="title desc">
<title id="title">Windowed render-loop frame delta p99</title><desc id="desc">p99 frame-loop delta ranges across five Godot windowed runs. Initial streaming and edited revisit exceed 33.3 milliseconds. Not a GPU presentation timestamp.</desc>
<rect width="840" height="360" fill="#fff"/><text x="420" y="27" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold">Windowed in-game frame-delta p99 across five runs</text>
<g stroke="#ddd" font-family="sans-serif" font-size="11" fill="#444"><line x1="235" y1="310" x2="790" y2="310"/><line x1="235" y1="250" x2="790" y2="250"/><line x1="235" y1="190" x2="790" y2="190"/><line x1="235" y1="130" x2="790" y2="130"/><line x1="235" y1="70" x2="790" y2="70"/><text x="225" y="314" text-anchor="end">0</text><text x="225" y="254" text-anchor="end">40</text><text x="225" y="194" text-anchor="end">80</text><text x="225" y="134" text-anchor="end">120</text><text x="225" y="74" text-anchor="end">160 ms</text></g>
<line x1="235" y1="260" x2="790" y2="260" stroke="#b22222" stroke-width="2" stroke-dasharray="6 5"/><text x="795" y="264" font-family="sans-serif" font-size="10" fill="#b22222">33.3 ms target</text>
<g font-family="sans-serif" font-size="11" fill="#333"><text x="220" y="95" text-anchor="end">Initial stream</text><text x="220" y="145" text-anchor="end">Five crossings</text><text x="220" y="195" text-anchor="end">Single clicks</text><text x="220" y="245" text-anchor="end">Two-region seam</text><text x="220" y="295" text-anchor="end">Unload / revisit</text></g>
<g stroke-width="8" stroke-linecap="round"><line x1="455" y1="91" x2="460" y2="85" stroke="#3274a1"/><line x1="287" y1="258" x2="310" y2="235" stroke="#3274a1"/><line x1="283" y1="262" x2="317" y2="228" stroke="#3274a1"/><line x1="260" y1="285" x2="264" y2="281" stroke="#3274a1"/><line x1="360" y1="185" x2="376" y2="169" stroke="#3274a1"/></g>
<g font-family="sans-serif" font-size="10" fill="#333"><text x="466" y="88">146.6–150.0</text><text x="316" y="245">34.5–50.0</text><text x="323" y="224">32.1–54.4</text><text x="270" y="278">16.7–19.1</text><text x="382" y="178">83.3–93.9</text></g>
<text x="512" y="337" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#555">Frame-loop delta from five windowed runs; not a GPU timer or OS present timestamp.</text>
</svg>
